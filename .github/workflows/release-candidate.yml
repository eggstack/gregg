  systemd-lifecycle:
    name: Protected systemd lifecycle
    needs: resolve
    if: ${{ inputs.stage == 'operational-evidence' && inputs.package_run_id != '' }}
    runs-on: [self-hosted, linux, gregg-systemd]
    environment: gregg-systemd
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: binary-greggd-${{ needs.resolve.outputs.short_sha }}-${{ inputs.package_run_attempt }}
          run-id: ${{ inputs.package_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: package-artifact
      - name: Exercise native systemd lifecycle
        run: |
          set -euo pipefail
          test -n "${GREGG_SYSTEMD_HOST:-}"
          mkdir -p evidence
          archive="$(find package-artifact -type f -name 'greggd-1.0.1.crate' -print -quit)"
          provenance="$(find package-artifact -type f -name package-provenance.json -print -quit)"
          test -n "${archive}" -a -n "${provenance}"
          scripts/install-verified-package.sh --manifest "${provenance}" --package greggd --archive "${archive}" --version 1.0.1 --candidate-sha "${{ needs.resolve.outputs.candidate_sha }}" --root "${RUNNER_TEMP}/greggd-systemd"
          binary="${RUNNER_TEMP}/greggd-systemd/bin/greggd"
          scripts/verify-package-provenance.sh --manifest "${provenance}" --package greggd --archive "${archive}" --binary "${binary}" --version 1.0.1 --candidate-sha "${{ needs.resolve.outputs.candidate_sha }}" --allow-platform-binary --output evidence/package-provenance.json
          {
            uname -a
            sudo packaging/install-linux.sh "${binary}"
            sudo systemctl enable --now greggd
            sudo systemctl is-active --quiet greggd
            curl --fail --silent http://127.0.0.1:11310/healthz
            sudo systemctl stop greggd
            if sudo systemctl is-active --quiet greggd; then exit 1; fi
            sudo systemctl start greggd
            sudo systemctl is-active --quiet greggd
            sudo systemctl restart greggd
            sudo systemctl is-active --quiet greggd
            sudo /usr/local/bin/greggd croncheck
            sudo systemctl stop greggd
            sudo /usr/local/bin/greggd croncheck
            sudo systemctl is-active --quiet greggd
            sudo systemctl disable --now greggd
          } 2>&1 | tee evidence/systemd-transcript.txt
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n '[{name:"systemd-transcript.txt",artifact_id:"systemd-transcript"},{name:"package-provenance.json",artifact_id:"systemd-package-provenance"}]' > evidence/artifacts.json
          python3 scripts/validate-release-evidence.py write-candidate --output evidence/candidate.json --candidate-sha "${{ needs.resolve.outputs.candidate_sha }}" --release-version 1.0.1 --stage systemd-lifecycle --workflow-run-id "${GITHUB_RUN_ID}" --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" --job-name systemd-lifecycle --runner-os "${RUNNER_OS}" --runner-architecture "$(uname -m)" --started-at "${now}" --completed-at "${now}" --artifacts-json evidence/artifacts.json
          python3 scripts/validate-release-evidence.py validate-candidate evidence/candidate.json --expected-sha "${{ needs.resolve.outputs.candidate_sha }}" --expected-version 1.0.1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: systemd-${{ needs.resolve.outputs.short_sha }}-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: error

  launchd-lifecycle:
    name: Protected launchd lifecycle
    needs: resolve
    if: ${{ inputs.stage == 'operational-evidence' && inputs.package_run_id != '' }}
    runs-on: [self-hosted, macos, gregg-launchd]
    environment: gregg-launchd
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: binary-greggd-${{ needs.resolve.outputs.short_sha }}-${{ inputs.package_run_attempt }}
          run-id: ${{ inputs.package_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: package-artifact
      - name: Exercise native launchd lifecycle
        run: |
          set -euo pipefail
          test -n "${GREGG_LAUNCHD_HOST:-}"
          mkdir -p evidence
          archive="$(find package-artifact -type f -name 'greggd-1.0.1.crate' -print -quit)"
          provenance="$(find package-artifact -type f -name package-provenance.json -print -quit)"
          test -n "${archive}" -a -n "${provenance}"
          scripts/install-verified-package.sh --manifest "${provenance}" --package greggd --archive "${archive}" --version 1.0.1 --candidate-sha "${{ needs.resolve.outputs.candidate_sha }}" --root "${RUNNER_TEMP}/greggd-launchd"
          binary="${RUNNER_TEMP}/greggd-launchd/bin/greggd"
          scripts/verify-package-provenance.sh --manifest "${provenance}" --package greggd --archive "${archive}" --binary "${binary}" --version 1.0.1 --candidate-sha "${{ needs.resolve.outputs.candidate_sha }}" --allow-platform-binary --output evidence/package-provenance.json
          {
            uname -a
            sudo packaging/install-macos.sh "${binary}"
            sudo launchctl bootstrap system /Library/LaunchDaemons/com.eggstack.greggd.plist
            sudo launchctl print system/com.eggstack.greggd
            curl --fail --silent http://127.0.0.1:11310/healthz
            sudo /usr/local/bin/greggd stop
            sudo /usr/local/bin/greggd stop
            sudo /usr/local/bin/greggd start
            sudo launchctl print system/com.eggstack.greggd
            sudo /usr/local/bin/greggd restart
            sudo launchctl print system/com.eggstack.greggd
            sudo /usr/local/bin/greggd croncheck
            sudo /usr/local/bin/greggd stop
          } 2>&1 | tee evidence/launchd-transcript.txt
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n '[{name:"launchd-transcript.txt",artifact_id:"launchd-transcript"},{name:"package-provenance.json",artifact_id:"launchd-package-provenance"}]' > evidence/artifacts.json
          python3 scripts/validate-release-evidence.py write-candidate --output evidence/candidate.json --candidate-sha "${{ needs.resolve.outputs.candidate_sha }}" --release-version 1.0.1 --stage launchd-lifecycle --workflow-run-id "${GITHUB_RUN_ID}" --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" --job-name launchd-lifecycle --runner-os "${RUNNER_OS}" --runner-architecture "$(uname -m)" --started-at "${now}" --completed-at "${now}" --artifacts-json evidence/artifacts.json
          python3 scripts/validate-release-evidence.py validate-candidate evidence/candidate.json --expected-sha "${{ needs.resolve.outputs.candidate_sha }}" --expected-version 1.0.1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launchd-${{ needs.resolve.outputs.short_sha }}-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: error

  postpublish-verify:
    name: Postpublication registry installs
    needs: [resolve, protocol-index-check]
    if: ${{ always() && inputs.stage == 'postpublish-verify' && needs.protocol-index-check.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install and exercise published binaries
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.resolve.outputs.candidate_sha }}"
          mkdir -p evidence "${RUNNER_TEMP}/greggd" "${RUNNER_TEMP}/gregg"
          scripts/verify-candidate-identity.sh --mode tag --input v1.0.1 --candidate-sha "${{ needs.resolve.outputs.candidate_sha }}" --output evidence/tag-identity.json
          for crate in gregg-protocol greggd gregg; do
            curl --fail --silent --show-error "https://crates.io/api/v1/crates/${crate}/1.0.1" >"evidence/registry-${crate}.json"
            jq -e --arg crate "${crate}" '.version.num == "1.0.1" and .version.crate == $crate and .version.yanked == false and (.version.cksum | type == "string" and length == 64) and (.version.created_at | type == "string" and length > 0)' "evidence/registry-${crate}.json" >/dev/null
          done
          jq -s '[.[] | {crate:.version.crate,version:.version.num,checksum:.version.cksum,published_at:.version.created_at,yanked:.version.yanked}]' evidence/registry-*.json > evidence/registry-summary.json
          cargo install greggd --version '=1.0.1' --locked --root "${RUNNER_TEMP}/greggd" | tee evidence/greggd-install.txt
          cargo install gregg --version '=1.0.1' --locked --root "${RUNNER_TEMP}/gregg" | tee evidence/gregg-install.txt
          "${RUNNER_TEMP}/greggd/bin/greggd" --help | tee evidence/greggd-help.txt
          "${RUNNER_TEMP}/greggd/bin/greggd" --version | tee evidence/greggd-version.txt
          "${RUNNER_TEMP}/gregg/bin/gregg" --help | tee evidence/gregg-help.txt
          "${RUNNER_TEMP}/gregg/bin/gregg" --version | tee evidence/gregg-version.txt
          ./scripts/verify-installed-daemon.sh "${RUNNER_TEMP}/greggd/bin/greggd" | tee evidence/installed-daemon-verifier.txt
          client_config="${RUNNER_TEMP}/gregg.toml"
          "${RUNNER_TEMP}/gregg/bin/gregg" --config "${client_config}" add 127.0.0.1:9 --name registry-smoke
          test "$(stat -c '%a' "${client_config}")" = 600
          sha256sum "${RUNNER_TEMP}/greggd/bin/greggd" "${RUNNER_TEMP}/gregg/bin/gregg" | tee evidence/installed.sha256
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n '[{name:"registry-summary.json",artifact_id:"registry-summary"},{name:"installed-daemon-verifier.txt",artifact_id:"daemon-verifier"},{name:"installed.sha256",artifact_id:"binary-checksums"},{name:"greggd-install.txt",artifact_id:"greggd-install"},{name:"gregg-install.txt",artifact_id:"gregg-install"}]' > evidence/artifacts.json
          python3 scripts/validate-release-evidence.py write-candidate --output evidence/candidate.json --candidate-sha "${{ needs.resolve.outputs.candidate_sha }}" --release-version 1.0.1 --stage postpublish-verify --workflow-run-id "${GITHUB_RUN_ID}" --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" --job-name postpublish-verify --runner-os "${RUNNER_OS}" --runner-architecture "$(uname -m)" --started-at "${now}" --completed-at "${now}" --artifacts-json evidence/artifacts.json --executable greggd "$(awk '/greggd/{print $1}' evidence/installed.sha256)" "$(stat -c '%s' "${RUNNER_TEMP}/greggd/bin/greggd")" --executable gregg "$(awk '/gregg/{print $1}' evidence/installed.sha256)" "$(stat -c '%s' "${RUNNER_TEMP}/gregg/bin/gregg")"
          python3 scripts/validate-release-evidence.py validate-candidate evidence/candidate.json --expected-sha "${{ needs.resolve.outputs.candidate_sha }}" --expected-version 1.0.1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postpublish-${{ needs.resolve.outputs.short_sha }}-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: error

  aggregate:
    name: Aggregate candidate evidence
    needs: [resolve, source-ci, protocol-prepublish, protocol-index-check, binary-prepublish, binary-msrv, native-evidence, mixed-fleet-client, operational-evidence, operational-macos-evidence, systemd-lifecycle, launchd-lifecycle, postpublish-verify]
    if: ${{ always() && needs.resolve.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          path: evidence
          pattern: "*-${{ needs.resolve.outputs.short_sha }}-${{ github.run_attempt }}"
          merge-multiple: false
          if-no-artifact-found: error
      - name: Validate and aggregate metadata
        run: |
          set -euo pipefail
          required=()
          case "${{ inputs.stage }}" in
            protocol-prepublish) required=(source-ci protocol-prepublish) ;;
            protocol-index-check) required=(protocol-index-check) ;;
            binary-prepublish) required=(source-ci protocol-index-check binary-prepublish-greggd binary-prepublish-gregg binary-msrv-greggd binary-msrv-gregg) ;;
            native-evidence) required=(source-ci native-linux-x86-64 native-linux-arm64 native-macos-arm64 native-macos-intel) ;;
            mixed-fleet-client) required=(source-ci mixed-fleet-client) ;;
            operational-evidence) required=(resource-linux resource-macos-arm64 soak-linux-24h soak-macos-arm64-24h systemd-lifecycle launchd-lifecycle) ;;
            postpublish-verify) required=(protocol-index-check postpublish-verify) ;;
            *) echo "unsupported aggregation stage" >&2; exit 1 ;;
          esac
          args=(--evidence-dir evidence --expected-sha "${{ needs.resolve.outputs.candidate_sha }}" --release-version "${{ needs.resolve.outputs.candidate_version }}" --output aggregate-candidate.json)
          for stage in "${required[@]}"; do args+=(--required-stage "${stage}"); done
          scripts/aggregate-release-evidence.sh "${args[@]}"
          cat aggregate-candidate.json
      - uses: actions/upload-artifact@v4
        with:
          name: aggregate-${{ needs.resolve.outputs.short_sha }}-${{ github.run_attempt }}
          path: aggregate-candidate.json
          if-no-files-found: error
