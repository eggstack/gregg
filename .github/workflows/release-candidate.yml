          test -f "${provenance}" || provenance="$(find package-artifact -type f -name package-provenance.json -print -quit)"
          test -f "${archive}" -a -f "${provenance}"
          scripts/install-verified-package.sh --manifest "${provenance}" --package greggd --archive "${archive}" --version 1.0.1 --candidate-sha "${{ needs.resolve.outputs.candidate_sha }}" --root "${RUNNER_TEMP}/greggd-launchd" --lockfile "package-artifact/evidence/greggd-Cargo.lock"
          binary="${RUNNER_TEMP}/greggd-launchd/bin/greggd"
