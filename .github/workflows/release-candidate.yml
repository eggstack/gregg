          mkdir -p evidence
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cargo test -p gregg --all-targets --all-features mixed_fleet -- --nocapture 2>&1 | tee evidence/fleet-transition.txt
          completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n '[{name:"fleet-transition.txt",role:"client-state-engine"}]' > evidence/artifacts.json
