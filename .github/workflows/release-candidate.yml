name: release-candidate

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: "Immutable commit SHA or annotated tag to verify"
        required: true
        type: string
      stage:
        description: "Explicit release-gate stage"
        required: true
        type: choice
        default: protocol-prepublish
        options:
          - protocol-prepublish
          - protocol-index-check
          - binary-prepublish
          - native-evidence
          - operational-evidence
          - postpublish-verify

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  resolve:
    name: Resolve immutable candidate
    runs-on: ubuntu-latest
    outputs:
      candidate_sha: ${{ steps.resolve.outputs.candidate_sha }}
      candidate_version: ${{ steps.resolve.outputs.candidate_version }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - id: resolve
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse "${{ inputs.candidate_ref }}^{commit}")"
          short_sha="$(git rev-parse --short=8 "${{ inputs.candidate_ref }}^{commit}")"
          version="$(cargo metadata --format-version 1 --no-deps | jq -r '.workspace_packages[0].version')"
          test "${candidate_sha}" = "$(git rev-parse HEAD)"
          test "${version}" = "1.0.1"
          grep -Eq 'gregg-protocol[[:space:]]*=[[:space:]]*\{[^}]*version[[:space:]]*=[[:space:]]*"1\.0\.1"' crates/greggd/Cargo.toml
          grep -Eq 'gregg-protocol[[:space:]]*=[[:space:]]*\{[^}]*version[[:space:]]*=[[:space:]]*"1\.0\.1"' crates/gregg/Cargo.toml
          test -z "$(git status --porcelain)"
          test -f Cargo.lock
          echo "candidate_sha=${candidate_sha}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${short_sha}" >> "${GITHUB_OUTPUT}"
          echo "candidate_version=${version}" >> "${GITHUB_OUTPUT}"

  source-ci:
    name: Source CI and shell validation
    needs: resolve
    if: ${{ inputs.stage == 'protocol-prepublish' || inputs.stage == 'binary-prepublish' || inputs.stage == 'native-evidence' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Standard gates
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-targets --all-features
          cargo doc --workspace --no-deps
      - name: Shell gates
        run: |
          set -euo pipefail
          for script in scripts/*.sh packaging/*.sh; do bash -n "${script}"; done
          command -v shellcheck >/dev/null 2>&1
          shellcheck scripts/*.sh packaging/*.sh
          bash scripts/test-verify-installed-daemon.sh
      - name: Dependency policy
        uses: EmbarkStudios/cargo-deny-action@v2
      - name: Record duplicate dependency tree
        run: |
          set -euo pipefail
          mkdir -p evidence
          cargo tree -d | tee evidence/duplicate-dependencies.txt
      - name: Candidate metadata
        run: |
          set -euo pipefail
          mkdir -p evidence
          jq -n --arg candidate_sha "${{ needs.resolve.outputs.candidate_sha }}" \
            --arg version "${{ needs.resolve.outputs.candidate_version }}" \
            --arg stage source-ci --arg run_id "${GITHUB_RUN_ID}" \
            --arg attempt "${GITHUB_RUN_ATTEMPT}" --arg os "${RUNNER_OS}" \
            --arg arch "$(uname -m)" --arg rustc "$(rustc --version)" \
            '{candidate_sha:$candidate_sha,version:$version,stage:$stage,run_id:$run_id,attempt:$attempt,os:$os,architecture:$arch,rustc:$rustc}' \
            > evidence/candidate.json
      - uses: actions/upload-artifact@v4
        with:
          name: source-ci-${{ needs.resolve.outputs.short_sha }}-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: error

  protocol-prepublish:
    name: Protocol prepublication
    needs: [resolve, source-ci]
    if: ${{ always() && inputs.stage == 'protocol-prepublish' && needs.source-ci.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Package, unpack, and build protocol
        run: |
          set -euo pipefail
          mkdir -p evidence unpacked
          cargo package -p gregg-protocol --list | tee evidence/package-list.txt
          cargo package -p gregg-protocol
          archive="target/package/gregg-protocol-${{ needs.resolve.outputs.candidate_version }}.crate"
          test -f "${archive}"
          sha256sum "${archive}" | tee evidence/package.sha256
          stat -c '%s' "${archive}" > evidence/package.size
          tar -xzf "${archive}" -C unpacked
          package_dir="unpacked/gregg-protocol-${{ needs.resolve.outputs.candidate_version }}"
          cp "${package_dir}/Cargo.toml" evidence/normalized-Cargo.toml
          cargo build --manifest-path "${package_dir}/Cargo.toml" --all-features
          cargo test --manifest-path "${package_dir}/Cargo.toml" --all-features
          rustup toolchain install 1.75 --profile minimal
          cargo +1.75 build --manifest-path "${package_dir}/Cargo.toml" --all-features
          mkdir -p consumer/src
          printf '[package]\nname="consumer"\nversion="0.0.0"\nedition="2021"\n[dependencies]\ngregg-protocol={path="%s"}\n' "$PWD/${package_dir}" > consumer/Cargo.toml
          : > consumer/src/main.rs
          cargo check --manifest-path consumer/Cargo.toml
          jq -n --arg candidate_sha "${{ needs.resolve.outputs.candidate_sha }}" \
            --arg version "${{ needs.resolve.outputs.candidate_version }}" \
            --arg stage protocol-prepublish --arg run_id "${GITHUB_RUN_ID}" \
            --arg attempt "${GITHUB_RUN_ATTEMPT}" --arg os "${RUNNER_OS}" \
            --arg arch "$(uname -m)" --arg checksum "$(cut -d' ' -f1 evidence/package.sha256)" \
            '{candidate_sha:$candidate_sha,version:$version,stage:$stage,run_id:$run_id,attempt:$attempt,os:$os,architecture:$arch,package:"gregg-protocol",checksum:$checksum}' \
            > evidence/candidate.json
      - uses: actions/upload-artifact@v4
        with:
          name: protocol-prepublish-${{ needs.resolve.outputs.short_sha }}-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: error

  protocol-index-check:
    name: Indexed protocol prerequisite
    needs: resolve
    if: ${{ inputs.stage == 'protocol-index-check' || inputs.stage == 'binary-prepublish' || inputs.stage == 'postpublish-verify' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve crates.io record and consumer
        run: |
          set -euo pipefail
          mkdir -p evidence consumer/src
          curl --fail --silent --show-error https://crates.io/api/v1/crates/gregg-protocol/1.0.1 > evidence/registry.json
          jq -e '.version.num == "1.0.1" and .version.yanked == false and (.version.cksum | type == "string")' evidence/registry.json >/dev/null
          cat > consumer/Cargo.toml <<'EOF'
          [package]
          name = "consumer"
          version = "0.0.0"
          edition = "2021"
          [dependencies]
          gregg-protocol = "=1.0.1"
          EOF
          : > consumer/src/main.rs
          cargo generate-lockfile --manifest-path consumer/Cargo.toml
          cargo check --manifest-path consumer/Cargo.toml --locked
          cargo tree --manifest-path consumer/Cargo.toml --locked | tee evidence/consumer-tree.txt
          jq -n --arg candidate_sha "${{ needs.resolve.outputs.candidate_sha }}" \
            --arg version "1.0.1" --arg stage protocol-index-check \
            --arg run_id "${GITHUB_RUN_ID}" --arg attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg os "${RUNNER_OS}" --arg arch "$(uname -m)" \
            --arg checksum "$(jq -r '.version.cksum' evidence/registry.json)" \
            --arg published "$(jq -r '.version.created_at' evidence/registry.json)" \
            '{candidate_sha:$candidate_sha,version:$version,stage:$stage,run_id:$run_id,attempt:$attempt,os:$os,architecture:$arch,registry_checksum:$checksum,published_at:$published,yanked:false}' \
            > evidence/candidate.json
      - uses: actions/upload-artifact@v4
        with:
          name: protocol-index-${{ needs.resolve.outputs.short_sha }}-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: error

  binary-prepublish:
    name: Binary package gate
    needs: [resolve, source-ci, protocol-index-check]
    if: ${{ always() && inputs.stage == 'binary-prepublish' && needs.source-ci.result == 'success' && needs.protocol-index-check.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [greggd, gregg]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Unpack, install, and smoke package
        run: |
          set -euo pipefail
          mkdir -p evidence unpacked
          cargo package -p "${{ matrix.crate }}" --list | tee "evidence/${{ matrix.crate }}-package-list.txt"
          cargo package -p "${{ matrix.crate }}"
          archive="target/package/${{ matrix.crate }}-${{ needs.resolve.outputs.candidate_version }}.crate"
          test -f "${archive}"
          sha256sum "${archive}" | tee "evidence/${{ matrix.crate }}.sha256"
          stat -c '%s' "${archive}" > "evidence/${{ matrix.crate }}.size"
          tar -xzf "${archive}" -C unpacked
          package_dir="unpacked/${{ matrix.crate }}-${{ needs.resolve.outputs.candidate_version }}"
          cp "${package_dir}/Cargo.toml" "evidence/${{ matrix.crate }}-normalized-Cargo.toml"
          cargo generate-lockfile --manifest-path "${package_dir}/Cargo.toml"
          cargo build --manifest-path "${package_dir}/Cargo.toml" --all-features
          cargo test --manifest-path "${package_dir}/Cargo.toml" --all-features
          install_root="${RUNNER_TEMP}/${{ matrix.crate }}-install"
          rm -rf "${install_root}"
          cargo install --path "${package_dir}" --root "${install_root}"
          binary="${install_root}/bin/${{ matrix.crate }}"
          test -x "${binary}"
          sha256sum "${binary}" | tee "evidence/${{ matrix.crate }}-installed.sha256"
          stat -c '%s' "${binary}" > "evidence/${{ matrix.crate }}-installed.size"
          "${binary}" --help
          if [[ "${{ matrix.crate }}" == greggd ]]; then
            ./scripts/verify-installed-daemon.sh "${binary}"
          fi
          jq -n --arg candidate_sha "${{ needs.resolve.outputs.candidate_sha }}" \
            --arg version "${{ needs.resolve.outputs.candidate_version }}" \
            --arg stage "binary-prepublish-${{ matrix.crate }}" \
            --arg run_id "${GITHUB_RUN_ID}" --arg attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg os "${RUNNER_OS}" --arg arch "$(uname -m)" \
            '{candidate_sha:$candidate_sha,version:$version,stage:$stage,run_id:$run_id,attempt:$attempt,os:$os,architecture:$arch,crate:"${{ matrix.crate }}"}' \
            > evidence/candidate.json
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.crate }}-${{ needs.resolve.outputs.short_sha }}-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: error

  binary-msrv:
    name: Binary MSRV gate
    needs: [resolve, protocol-index-check]
    if: ${{ always() && inputs.stage == 'binary-prepublish' && needs.protocol-index-check.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [greggd, gregg]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.75"
      - name: Build unpacked binary under Rust 1.75
        run: |
          set -euo pipefail
          mkdir -p evidence unpacked
          cargo package -p "${{ matrix.crate }}"
          archive="target/package/${{ matrix.crate }}-${{ needs.resolve.outputs.candidate_version }}.crate"
          tar -xzf "${archive}" -C unpacked
          package_dir="unpacked/${{ matrix.crate }}-${{ needs.resolve.outputs.candidate_version }}"
          cargo generate-lockfile --manifest-path "${package_dir}/Cargo.toml"
          cargo +1.75 build --manifest-path "${package_dir}/Cargo.toml" --all-features
          cargo +1.75 test --manifest-path "${package_dir}/Cargo.toml" --all-features
          jq -n --arg candidate_sha "${{ needs.resolve.outputs.candidate_sha }}" \
            --arg version "${{ needs.resolve.outputs.candidate_version }}" \
            --arg stage "binary-msrv-${{ matrix.crate }}" \
            --arg run_id "${GITHUB_RUN_ID}" --arg attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg os "${RUNNER_OS}" --arg arch "$(uname -m)" \
            '{candidate_sha:$candidate_sha,version:$version,stage:$stage,run_id:$run_id,attempt:$attempt,os:$os,architecture:$arch,crate:"${{ matrix.crate }}",rust:"1.75"}' \
            > evidence/candidate.json
      - uses: actions/upload-artifact@v4
        with:
          name: msrv-${{ matrix.crate }}-${{ needs.resolve.outputs.short_sha }}-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: error

  native-evidence:
    name: Native platform evidence
    needs: [resolve, source-ci]
    if: ${{ inputs.stage == 'native-evidence' && needs.source-ci.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            expected_arch: x86_64
            name: linux-x86-64
          - runner: ubuntu-24.04-arm
            expected_arch: aarch64
            name: linux-arm64
          - runner: macos-15
            expected_arch: arm64
            name: macos-arm64
          - runner: macos-15-intel
            expected_arch: x86_64
            name: macos-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Assert native architecture and run gates
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.expected_arch }}"
          uname -a
          cargo test --workspace --all-targets --all-features
          cargo build --release -p greggd -p gregg
          if [[ "${{ matrix.name }}" == linux-* ]]; then
            cargo test -p greggd --all-features -- collector::linux
          else
            cargo test -p greggd --all-features -- collector::macos::ffi::native_tests
          fi
          bash scripts/verify-installed-daemon.sh target/release/greggd
      - name: Candidate metadata
        run: |
          set -euo pipefail
          mkdir -p evidence
          jq -n --arg candidate_sha "${{ needs.resolve.outputs.candidate_sha }}" \
            --arg version "1.0.1" --arg stage "native-${{ matrix.name }}" \
            --arg run_id "${GITHUB_RUN_ID}" --arg attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg os "${RUNNER_OS}" --arg arch "$(uname -m)" \
            '{candidate_sha:$candidate_sha,version:$version,stage:$stage,run_id:$run_id,attempt:$attempt,os:$os,architecture:$arch}' \
            > evidence/candidate.json
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.name }}-${{ needs.resolve.outputs.short_sha }}-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: error

  operational-evidence:
    name: Protected operational evidence
    needs: resolve
    if: ${{ inputs.stage == 'operational-evidence' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
    runs-on: [self-hosted, gregg-operational]
    environment: gregg-operational
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
          fetch-depth: 0
      - name: Run host-owned package gates
        run: |
          set -euo pipefail
          test -n "${GREGG_OPERATIONAL_HOST:-}"
          test -x "${GREGG_INSTALLED_GREGGD:?set GREGG_INSTALLED_GREGGD}"
          scripts/measure-resources.sh --daemon "${GREGG_INSTALLED_GREGGD}" --duration-secs "${GREGG_RESOURCE_DURATION_SECS:-30}"
          scripts/soak-test.sh --daemon "${GREGG_INSTALLED_GREGGD}" --duration-minutes "${GREGG_SOAK_DURATION_MINUTES:-1440}"
      - uses: actions/upload-artifact@v4
        with:
          name: operational-${{ needs.resolve.outputs.short_sha }}-${{ github.run_attempt }}
          path: |
            resource-measurement-*
            soak-results-*
          if-no-files-found: error

  systemd-lifecycle:
    name: Protected systemd lifecycle
    needs: resolve
    if: ${{ inputs.stage == 'operational-evidence' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
    runs-on: [self-hosted, linux, gregg-systemd]
    environment: gregg-systemd
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
          fetch-depth: 0
      - name: Exercise native systemd lifecycle
        run: |
          set -euo pipefail
          test -n "${GREGG_SYSTEMD_HOST:-}"
          test -x "${GREGG_SYSTEMD_BINARY:?set GREGG_SYSTEMD_BINARY to package-installed greggd}"
          mkdir -p evidence
          {
            uname -a
            sudo packaging/install-linux.sh "${GREGG_SYSTEMD_BINARY}"
            sudo systemctl enable --now greggd
            sudo systemctl is-active --quiet greggd
            curl --fail --silent http://127.0.0.1:11310/healthz
            sudo systemctl stop greggd
            if sudo systemctl is-active --quiet greggd; then exit 1; fi
            sudo systemctl start greggd
            sudo systemctl is-active --quiet greggd
            sudo systemctl restart greggd
            sudo systemctl is-active --quiet greggd
            sudo /usr/local/bin/greggd croncheck
            sudo systemctl stop greggd
            sudo /usr/local/bin/greggd croncheck
            sudo systemctl is-active --quiet greggd
            sudo systemctl disable --now greggd
          } 2>&1 | tee evidence/systemd-transcript.txt
          jq -n --arg candidate_sha "${{ needs.resolve.outputs.candidate_sha }}" \
            --arg version "1.0.1" --arg stage systemd-lifecycle \
            --arg run_id "${GITHUB_RUN_ID}" --arg attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg os "${RUNNER_OS}" --arg arch "$(uname -m)" \
            '{candidate_sha:$candidate_sha,version:$version,stage:$stage,run_id:$run_id,attempt:$attempt,os:$os,architecture:$arch}' \
            > evidence/candidate.json
      - uses: actions/upload-artifact@v4
        with:
          name: systemd-${{ needs.resolve.outputs.short_sha }}-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: error

  launchd-lifecycle:
    name: Protected launchd lifecycle
    needs: resolve
    if: ${{ inputs.stage == 'operational-evidence' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
    runs-on: [self-hosted, macos, gregg-launchd]
    environment: gregg-launchd
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
          fetch-depth: 0
      - name: Exercise native launchd lifecycle
        run: |
          set -euo pipefail
          test -n "${GREGG_LAUNCHD_HOST:-}"
          test -x "${GREGG_LAUNCHD_BINARY:?set GREGG_LAUNCHD_BINARY to package-installed greggd}"
          mkdir -p evidence
          {
            uname -a
            sudo packaging/install-macos.sh "${GREGG_LAUNCHD_BINARY}"
            sudo launchctl bootstrap system /Library/LaunchDaemons/com.eggstack.greggd.plist
            sudo launchctl print system/com.eggstack.greggd
            curl --fail --silent http://127.0.0.1:11310/healthz
            sudo /usr/local/bin/greggd stop
            sudo /usr/local/bin/greggd stop
            sudo /usr/local/bin/greggd start
            sudo launchctl print system/com.eggstack.greggd
            sudo /usr/local/bin/greggd restart
            sudo launchctl print system/com.eggstack.greggd
            sudo /usr/local/bin/greggd croncheck
            sudo /usr/local/bin/greggd stop
          } 2>&1 | tee evidence/launchd-transcript.txt
          jq -n --arg candidate_sha "${{ needs.resolve.outputs.candidate_sha }}" \
            --arg version "1.0.1" --arg stage launchd-lifecycle \
            --arg run_id "${GITHUB_RUN_ID}" --arg attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg os "${RUNNER_OS}" --arg arch "$(uname -m)" \
            '{candidate_sha:$candidate_sha,version:$version,stage:$stage,run_id:$run_id,attempt:$attempt,os:$os,architecture:$arch}' \
            > evidence/candidate.json
      - uses: actions/upload-artifact@v4
        with:
          name: launchd-${{ needs.resolve.outputs.short_sha }}-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: error

  postpublish-verify:
    name: Postpublication registry installs
    needs: [resolve, protocol-index-check]
    if: ${{ always() && inputs.stage == 'postpublish-verify' && needs.protocol-index-check.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: dtolnay/rust-toolchain@stable
      - name: Install and exercise published binaries
        run: |
          set -euo pipefail
          mkdir -p evidence "${RUNNER_TEMP}/greggd" "${RUNNER_TEMP}/gregg"
          cargo install greggd --version "=1.0.1" --locked --root "${RUNNER_TEMP}/greggd"
          cargo install gregg --version "=1.0.1" --locked --root "${RUNNER_TEMP}/gregg"
          "${RUNNER_TEMP}/greggd/bin/greggd" --help
          "${RUNNER_TEMP}/greggd/bin/greggd" --version
          "${RUNNER_TEMP}/gregg/bin/gregg" --help
          "${RUNNER_TEMP}/gregg/bin/gregg" --version
          ./scripts/verify-installed-daemon.sh "${RUNNER_TEMP}/greggd/bin/greggd"
          client_config="${RUNNER_TEMP}/gregg.toml"
          "${RUNNER_TEMP}/gregg/bin/gregg" --config "${client_config}" add 127.0.0.1:9 --name registry-smoke
          test "$(stat -c '%a' "${client_config}")" = 600
          sha256sum "${RUNNER_TEMP}/greggd/bin/greggd" "${RUNNER_TEMP}/gregg/bin/gregg" | tee evidence/installed.sha256
          jq -n --arg candidate_sha "${{ needs.resolve.outputs.candidate_sha }}" \
            --arg version "1.0.1" --arg stage postpublish-verify \
            --arg run_id "${GITHUB_RUN_ID}" --arg attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg os "${RUNNER_OS}" --arg arch "$(uname -m)" \
            '{candidate_sha:$candidate_sha,version:$version,stage:$stage,run_id:$run_id,attempt:$attempt,os:$os,architecture:$arch,registry_install:true}' \
            > evidence/candidate.json
      - uses: actions/upload-artifact@v4
        with:
          name: postpublish-${{ needs.resolve.outputs.short_sha }}-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: error

  aggregate:
    name: Aggregate candidate evidence
    needs: [resolve, source-ci, protocol-prepublish, protocol-index-check, binary-prepublish, binary-msrv, native-evidence, operational-evidence, systemd-lifecycle, launchd-lifecycle, postpublish-verify]
    if: ${{ always() && needs.resolve.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          path: evidence
          pattern: "*-${{ needs.resolve.outputs.short_sha }}-${{ github.run_attempt }}"
          merge-multiple: false
          if-no-artifact-found: error
      - name: Validate and aggregate metadata
        run: |
          set -euo pipefail
          bash scripts/aggregate-candidate-evidence.sh evidence "${{ needs.resolve.outputs.candidate_sha }}" aggregate-candidate.json
          cat aggregate-candidate.json
      - uses: actions/upload-artifact@v4
        with:
          name: aggregate-${{ needs.resolve.outputs.short_sha }}-${{ github.run_attempt }}
          path: aggregate-candidate.json
          if-no-files-found: error
