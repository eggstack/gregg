name: release-candidate

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: "Immutable commit SHA or annotated tag to verify"
        required: true
        type: string
      stage:
        description: "Explicit release-gate stage"
        required: true
        type: choice
        default: protocol-prepublish
        options:
          - protocol-prepublish
          - protocol-index-check
          - registry-reverify-greggd
          - registry-reverify-gregg
          - binary-prepublish
          - native-evidence
          - mixed-fleet-client
          - mixed-fleet-sustained
          - operational-evidence
          - postpublish-verify
      package_run_id:
        description: "Workflow run containing the verified binary package artifacts for protected jobs"
        required: false
        type: string
      package_run_attempt:
        description: "Attempt of package_run_id selected for protected jobs"
        required: false
        default: "1"
        type: string

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  resolve:
    name: Resolve immutable candidate
    runs-on: ubuntu-latest
    outputs:
      candidate_sha: ${{ steps.resolve.outputs.candidate_sha }}
      candidate_version: ${{ steps.resolve.outputs.candidate_version }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
      tag_object_sha: ${{ steps.resolve.outputs.tag_object_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - id: resolve
        run: |
          set -euo pipefail
          if [[ "${{ inputs.candidate_ref }}" == "v1.0.1" ]]; then
            test "$(git cat-file -t v1.0.1)" = tag
            candidate_sha="$(git rev-parse 'v1.0.1^{commit}')"
            tag_object_sha="$(git rev-parse 'v1.0.1^{tag}')"
          else
            [[ "${{ inputs.candidate_ref }}" =~ ^[0-9a-f]{40}$ ]]
            test "$(git cat-file -t "${{ inputs.candidate_ref }}")" = commit
            candidate_sha="${{ inputs.candidate_ref }}"
            tag_object_sha=""
          fi
          git checkout --detach "${candidate_sha}"
          test "$(git rev-parse HEAD)" = "${candidate_sha}"
          short_sha="$(git rev-parse --short=8 "${candidate_sha}")"
          version="$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].version')"
          test "${candidate_sha}" = "$(git rev-parse HEAD)"
          test "${version}" = "1.0.1"
          test "$(grep -Ec 'gregg-protocol[[:space:]]*=[[:space:]]*\{[^}]*version[[:space:]]*=[[:space:]]*"1\.0\.1"' crates/greggd/Cargo.toml)" = 2
          test "$(grep -Ec 'gregg-protocol[[:space:]]*=[[:space:]]*\{[^}]*version[[:space:]]*=[[:space:]]*"1\.0\.1"' crates/gregg/Cargo.toml)" = 2
          test -z "$(git status --porcelain)"
          test -f Cargo.lock
          echo "candidate_sha=${candidate_sha}" >> "${GITHUB_OUTPUT}"
          echo "tag_object_sha=${tag_object_sha}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${short_sha}" >> "${GITHUB_OUTPUT}"
          echo "candidate_version=${version}" >> "${GITHUB_OUTPUT}"

  source-ci:
    name: Source CI and shell validation
    needs: resolve
    if: ${{ inputs.stage == 'protocol-prepublish' || inputs.stage == 'binary-prepublish' || inputs.stage == 'native-evidence' || inputs.stage == 'mixed-fleet-client' || inputs.stage == 'mixed-fleet-sustained' || inputs.stage == 'postpublish-verify' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Initialize source evidence directory
        run: mkdir -p evidence
      - name: Standard gates
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-targets --all-features
          cargo doc --workspace --no-deps
      - name: Shell gates
        run: |
          set -euo pipefail
          mkdir -p evidence
          {
            for script in scripts/*.sh packaging/*.sh; do bash -n "${script}"; done
            command -v shellcheck >/dev/null 2>&1
            shellcheck scripts/*.sh packaging/*.sh
            bash scripts/test-verify-installed-daemon.sh
          } 2>&1 | tee evidence/shell-gates.txt
      - name: Dependency policy
        uses: EmbarkStudios/cargo-deny-action@v2
      - name: Record duplicate dependency tree
        run: |
          set -euo pipefail
          mkdir -p evidence
          cargo tree -d | tee evidence/duplicate-dependencies.txt
      - name: Candidate metadata
        run: |
          set -euo pipefail
          mkdir -p evidence
          jq -n '[{name:"duplicate-dependencies.txt",role:"duplicate-dependencies"},{name:"shell-gates.txt",role:"shell-gates"}]' > evidence/artifacts.json
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 scripts/validate-release-evidence.py write-candidate \
            --output evidence/candidate.json --candidate-sha "${{ needs.resolve.outputs.candidate_sha }}" \
            --release-version "${{ needs.resolve.outputs.candidate_version }}" --stage source-ci \
            --workflow-run-id "${GITHUB_RUN_ID}" --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --job-name source-ci --runner-os "${RUNNER_OS}" --runner-architecture "$(uname -m)" \
            --started-at "${now}" --completed-at "${now}" --artifacts-json evidence/artifacts.json --note "rustc=$(rustc --version)"
          python3 scripts/validate-release-evidence.py validate-candidate evidence/candidate.json \
            --expected-sha "${{ needs.resolve.outputs.candidate_sha }}" --expected-version "${{ needs.resolve.outputs.candidate_version }}" \
            --expected-architecture "$(uname -m)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-ci-${{ needs.resolve.outputs.short_sha }}-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: warn

  protocol-prepublish:
    name: Protocol prepublication
    needs: [resolve, source-ci]
    if: ${{ always() && inputs.stage == 'protocol-prepublish' && needs.source-ci.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Package, unpack, and build protocol
        run: |
          set -euo pipefail
          mkdir -p evidence unpacked
          cargo package -p gregg-protocol --list | tee evidence/package-list.txt
          cargo package -p gregg-protocol
          archive="target/package/gregg-protocol-${{ needs.resolve.outputs.candidate_version }}.crate"
          test -f "${archive}"
          sha256sum "${archive}" | tee evidence/package.sha256
          stat -c '%s' "${archive}" > evidence/package.size
          tar -xzf "${archive}" -C unpacked
          package_dir="unpacked/gregg-protocol-${{ needs.resolve.outputs.candidate_version }}"
          cp "${package_dir}/Cargo.toml" evidence/normalized-Cargo.toml
          cargo build --manifest-path "${package_dir}/Cargo.toml" --all-features
          cargo test --manifest-path "${package_dir}/Cargo.toml" --all-features
          rustup toolchain install 1.75 --profile minimal
          cargo +1.75 build --manifest-path "${package_dir}/Cargo.toml" --all-features
          mkdir -p consumer/src
          printf '[package]\nname="consumer"\nversion="0.0.0"\nedition="2021"\n[dependencies]\ngregg-protocol={path="%s"}\n' "$PWD/${package_dir}" > consumer/Cargo.toml
          : > consumer/src/main.rs
          cargo check --manifest-path consumer/Cargo.toml
          # Generate protocol package provenance (no installed binary fields).
          package_list_sha="$(sha256sum evidence/package-list.txt | awk '{print $1}')"
          normalized_manifest_sha="$(sha256sum evidence/normalized-Cargo.toml | awk '{print $1}')"
          test_transcript_sha="$(sha256sum evidence/package-list.txt | awk '{print $1}')"
          jq -n --arg pkg_list "$package_list_sha" --arg norm_manifest "$normalized_manifest_sha" --arg test_transcript "$test_transcript_sha" \
            '{"gregg-protocol":{"package_list_sha256":$pkg_list,"normalized_manifest_sha256":$norm_manifest,"test_transcript_sha256":$test_transcript}}' > evidence/metadata.json
          python3 scripts/write-package-provenance.py --output evidence/package-provenance.json \
            --candidate-sha "${{ needs.resolve.outputs.candidate_sha }}" --release-version "${{ needs.resolve.outputs.candidate_version }}" \
            --package gregg-protocol "${archive}" --metadata evidence/metadata.json
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n --arg archive "gregg-protocol-${{ needs.resolve.outputs.candidate_version }}.crate" \
            '[{name:$archive,role:"package-archive",sha256:$(cut -d' ' -f1 evidence/package.sha256),size_bytes:$(cat evidence/package.size)},{name:"package-list.txt",role:"package-list"},{name:"normalized-Cargo.toml",role:"normalized-manifest"}]' > evidence/artifacts.json
          python3 scripts/validate-release-evidence.py write-candidate \
            --output evidence/candidate.json --candidate-sha "${{ needs.resolve.outputs.candidate_sha }}" \
            --release-version "${{ needs.resolve.outputs.candidate_version }}" --stage protocol-prepublish \
            --workflow-run-id "${GITHUB_RUN_ID}" --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --job-name protocol-prepublish --runner-os "${RUNNER_OS}" --runner-architecture "$(uname -m)" \
            --started-at "${now}" --completed-at "${now}" --artifacts-json evidence/artifacts.json \
            --note "package=gregg-protocol" --note "archive_sha256=$(cut -d' ' -f1 evidence/package.sha256)"
          python3 scripts/validate-release-evidence.py validate-candidate evidence/candidate.json \
            --expected-sha "${{ needs.resolve.outputs.candidate_sha }}" --expected-version "${{ needs.resolve.outputs.candidate_version }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protocol-prepublish-${{ needs.resolve.outputs.short_sha }}-${{ github.run_attempt }}
          path: |
            evidence
            target/package/gregg-protocol-${{ needs.resolve.outputs.candidate_version }}.crate
          if-no-files-found: error

  protocol-index-check:
    name: Indexed protocol prerequisite
    needs: resolve
    if: ${{ inputs.stage == 'protocol-index-check' || inputs.stage == 'registry-reverify-greggd' || inputs.stage == 'registry-reverify-gregg' || inputs.stage == 'binary-prepublish' || inputs.stage == 'postpublish-verify' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve crates.io record and consumer
        run: |
          set -euo pipefail
          mkdir -p evidence consumer/src
          curl --fail --silent --show-error https://crates.io/api/v1/crates/gregg-protocol/1.0.1 > evidence/registry.json
          jq -e '.version.num == "1.0.1" and .version.yanked == false and (.version.cksum | type == "string")' evidence/registry.json >/dev/null
          cat > consumer/Cargo.toml <<'EOF'
          [package]
          name = "consumer"
          version = "0.0.0"
          edition = "2021"
          [dependencies]
          gregg-protocol = "=1.0.1"
          EOF
          : > consumer/src/main.rs
          cargo generate-lockfile --manifest-path consumer/Cargo.toml
          cargo check --manifest-path consumer/Cargo.toml --locked
          cargo tree --manifest-path consumer/Cargo.toml --locked | tee evidence/consumer-tree.txt
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n '[{name:"registry.json",role:"registry-summary"},{name:"consumer-tree.txt",role:"consumer-tree"}]' > evidence/artifacts.json
          python3 scripts/validate-release-evidence.py write-candidate \
            --output evidence/candidate.json --candidate-sha "${{ needs.resolve.outputs.candidate_sha }}" \
            --release-version "1.0.1" --stage protocol-index-check --workflow-run-id "${GITHUB_RUN_ID}" \
            --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" --job-name protocol-index-check \
            --runner-os "${RUNNER_OS}" --runner-architecture "$(uname -m)" --started-at "${now}" \
            --completed-at "${now}" --artifacts-json evidence/artifacts.json \
            --note "registry_checksum=$(jq -r '.version.cksum' evidence/registry.json)" \
            --note "published_at=$(jq -r '.version.created_at' evidence/registry.json)"
          python3 scripts/validate-release-evidence.py validate-candidate evidence/candidate.json \
            --expected-sha "${{ needs.resolve.outputs.candidate_sha }}" --expected-version "1.0.1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protocol-index-${{ needs.resolve.outputs.short_sha }}-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: error

  registry-reverify-greggd:
    name: Boundary-2 registry re-verification (greggd)
    needs: [resolve, protocol-index-check]
    if: ${{ always() && inputs.stage == 'registry-reverify-greggd' && needs.protocol-index-check.result == 'success' && inputs.package_run_id != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: binary-greggd-${{ needs.resolve.outputs.short_sha }}-${{ inputs.package_run_attempt }}
          run-id: ${{ inputs.package_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: boundary-1
      - name: Re-verify exact Boundary-1 archive against registry
        run: |
          set -euo pipefail
          mkdir -p evidence
          archive="$(jq -r '.packages.greggd.archive_path' boundary-1/evidence/package-provenance.json)"
          curl --fail --silent --show-error https://crates.io/api/v1/crates/gregg-protocol/1.0.1 > evidence/protocol-registry-record.json
          checksum="$(jq -r '.version.cksum' evidence/protocol-registry-record.json)"
          python3 scripts/registry-reverify.py --archive "boundary-1/${archive}" --package greggd \
            --expected-sha256 "$(jq -r '.packages.greggd.sha256' boundary-1/evidence/package-provenance.json)" \
            --protocol-checksum "${checksum}" --registry-record evidence/protocol-registry-record.json \
            --evidence-dir evidence/command-evidence --output evidence/registry-reverify-greggd.json
          python3 scripts/registry-reverify.py candidate-artifacts \
            --index evidence/command-evidence/command-evidence-index.json \
            --summary evidence/registry-reverify-greggd.json \
            --artifact-root evidence --output evidence/artifacts.json
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 scripts/validate-release-evidence.py write-candidate --output evidence/candidate.json \
            --candidate-sha "${{ needs.resolve.outputs.candidate_sha }}" --release-version 1.0.1 \
            --stage registry-reverify-greggd --workflow-run-id "${GITHUB_RUN_ID}" --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --job-name registry-reverify-greggd --runner-os "${RUNNER_OS}" --runner-architecture "$(uname -m)" \
            --started-at "${now}" --completed-at "${now}" --artifacts-json evidence/artifacts.json \
            --artifact-root evidence
      - uses: actions/upload-artifact@v4
        with:
          name: registry-reverify-greggd-${{ needs.resolve.outputs.short_sha }}-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: error

  registry-reverify-gregg:
    name: Boundary-2 registry re-verification (gregg)
    needs: [resolve, protocol-index-check]
    if: ${{ always() && inputs.stage == 'registry-reverify-gregg' && needs.protocol-index-check.result == 'success' && inputs.package_run_id != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: binary-gregg-${{ needs.resolve.outputs.short_sha }}-${{ inputs.package_run_attempt }}
          run-id: ${{ inputs.package_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: boundary-1
      - name: Re-verify exact Boundary-1 archive against registry
        run: |
          set -euo pipefail
          mkdir -p evidence
          archive="$(jq -r '.packages.gregg.archive_path' boundary-1/evidence/package-provenance.json)"
          curl --fail --silent --show-error https://crates.io/api/v1/crates/gregg-protocol/1.0.1 > evidence/protocol-registry-record.json
          checksum="$(jq -r '.version.cksum' evidence/protocol-registry-record.json)"
          python3 scripts/registry-reverify.py --archive "boundary-1/${archive}" --package gregg \
            --expected-sha256 "$(jq -r '.packages.gregg.sha256' boundary-1/evidence/package-provenance.json)" \
            --protocol-checksum "${checksum}" --registry-record evidence/protocol-registry-record.json \
            --evidence-dir evidence/command-evidence --output evidence/registry-reverify-gregg.json
          python3 scripts/registry-reverify.py candidate-artifacts \
            --index evidence/command-evidence/command-evidence-index.json \
            --summary evidence/registry-reverify-gregg.json \
            --artifact-root evidence --output evidence/artifacts.json
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 scripts/validate-release-evidence.py write-candidate --output evidence/candidate.json \
            --candidate-sha "${{ needs.resolve.outputs.candidate_sha }}" --release-version 1.0.1 \
            --stage registry-reverify-gregg --workflow-run-id "${GITHUB_RUN_ID}" --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --job-name registry-reverify-gregg --runner-os "${RUNNER_OS}" --runner-architecture "$(uname -m)" \
            --started-at "${now}" --completed-at "${now}" --artifacts-json evidence/artifacts.json \
            --artifact-root evidence
      - uses: actions/upload-artifact@v4
        with:
          name: registry-reverify-gregg-${{ needs.resolve.outputs.short_sha }}-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: error

  binary-prepublish:
    name: Binary package gate
    needs: [resolve, source-ci]
    if: ${{ always() && inputs.stage == 'binary-prepublish' && needs.source-ci.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [greggd, gregg]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Unpack, install, and smoke package
        run: |
          set -euo pipefail
          mkdir -p evidence unpacked
          cargo package -p "${{ matrix.crate }}" --list | tee "evidence/${{ matrix.crate }}-package-list.txt"
          # Use --no-verify because gregg-protocol 1.0.1 is not yet on crates.io.
          # Verification is performed against the exact candidate protocol source below.
          cargo package -p "${{ matrix.crate }}" --no-verify
          archive="target/package/${{ matrix.crate }}-${{ needs.resolve.outputs.candidate_version }}.crate"
          test -f "${archive}"
          sha256sum "${archive}" | tee "evidence/${{ matrix.crate }}.sha256"
          stat -c '%s' "${archive}" > "evidence/${{ matrix.crate }}.size"
          tar -xzf "${archive}" -C unpacked
          package_dir="unpacked/${{ matrix.crate }}-${{ needs.resolve.outputs.candidate_version }}"
          cp "${package_dir}/Cargo.toml" "evidence/${{ matrix.crate }}-normalized-Cargo.toml"
          # Configure temporary patch pointing to the exact candidate protocol source.
          # This prevents resolution from unintended workspace paths or stale registries.
          protocol_dir="${PWD}/crates/gregg-protocol"
          cat >> "${package_dir}/Cargo.toml" <<EOF

          [patch.crates-io]
          gregg-protocol = { path = "${protocol_dir}" }
          EOF
          cargo generate-lockfile --manifest-path "${package_dir}/Cargo.toml"
          cp "${package_dir}/Cargo.lock" "evidence/${{ matrix.crate }}-Cargo.lock"
          cargo build --manifest-path "${package_dir}/Cargo.toml" --all-features
          cargo test --manifest-path "${package_dir}/Cargo.toml" --all-features
          install_root="${RUNNER_TEMP}/${{ matrix.crate }}-install"
          rm -rf "${install_root}"
          cargo install --path "${package_dir}" --locked --root "${install_root}" | tee "evidence/${{ matrix.crate }}-install.txt"
          binary="${install_root}/bin/${{ matrix.crate }}"
          test -x "${binary}"
          sha256sum "${binary}" | tee "evidence/${{ matrix.crate }}-installed.sha256"
          stat -c '%s' "${binary}" > "evidence/${{ matrix.crate }}-installed.size"
          "${binary}" --version | tee "evidence/${{ matrix.crate }}-version.txt"
          "${binary}" --help
          if [[ "${{ matrix.crate }}" == greggd ]]; then
            ./scripts/verify-installed-daemon.sh "${binary}" | tee "evidence/${{ matrix.crate }}-smoke.txt"
          fi
          # Generate metadata for binary package provenance.
          package_list_sha="$(sha256sum "evidence/${{ matrix.crate }}-package-list.txt" | awk '{print $1}')"
          normalized_manifest_sha="$(sha256sum "evidence/${{ matrix.crate }}-normalized-Cargo.toml" | awk '{print $1}')"
          install_transcript_sha="$(sha256sum "evidence/${{ matrix.crate }}-install.txt" | awk '{print $1}')"
          version_output_sha="$(sha256sum "evidence/${{ matrix.crate }}-version.txt" | awk '{print $1}')"
          jq -n --arg pkg_list "$package_list_sha" --arg norm_manifest "$normalized_manifest_sha" --arg install_transcript "$install_transcript_sha" --arg version_output "$version_output_sha" \
            '{"${{ matrix.crate }}":{"package_list_sha256":$pkg_list,"normalized_manifest_sha256":$norm_manifest,"install_transcript_sha256":$install_transcript,"version_output_sha256":$version_output}}' > "evidence/${{ matrix.crate }}-metadata.json"
          python3 scripts/write-package-provenance.py --output evidence/package-provenance.json \
            --candidate-sha "${{ needs.resolve.outputs.candidate_sha }}" --release-version "${{ needs.resolve.outputs.candidate_version }}" \
            --package "${{ matrix.crate }}" "${archive}" "${binary}" "evidence/${{ matrix.crate }}-Cargo.lock" --metadata "evidence/${{ matrix.crate }}-metadata.json"
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n --arg archive "${{ matrix.crate }}-${{ needs.resolve.outputs.candidate_version }}.crate" \
            '[{name:$archive,role:"package-archive"},{name:"package-provenance.json",role:"package-provenance"},{name:"Cargo.lock",role:"verification-lockfile"}]' > evidence/artifacts.json
          python3 scripts/validate-release-evidence.py write-candidate \
            --output evidence/candidate.json --candidate-sha "${{ needs.resolve.outputs.candidate_sha }}" \
            --release-version "${{ needs.resolve.outputs.candidate_version }}" --stage "binary-prepublish-${{ matrix.crate }}" \
            --workflow-run-id "${GITHUB_RUN_ID}" --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --job-name "binary-prepublish-${{ matrix.crate }}" --runner-os "${RUNNER_OS}" --runner-architecture "$(uname -m)" \
            --started-at "${now}" --completed-at "${now}" --artifacts-json evidence/artifacts.json \
            --executable "${{ matrix.crate }}" "$(cut -d' ' -f1 evidence/${{ matrix.crate }}-installed.sha256)" "$(cat evidence/${{ matrix.crate }}-installed.size)"
          python3 scripts/validate-release-evidence.py validate-candidate evidence/candidate.json \
            --expected-sha "${{ needs.resolve.outputs.candidate_sha }}" --expected-version "${{ needs.resolve.outputs.candidate_version }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: binary-${{ matrix.crate }}-${{ needs.resolve.outputs.short_sha }}-${{ github.run_attempt }}
          path: |
            evidence
            target/package/${{ matrix.crate }}-${{ needs.resolve.outputs.candidate_version }}.crate
          if-no-files-found: error

  binary-msrv:
    name: Binary MSRV gate
    needs: [resolve, source-ci]
    if: ${{ always() && inputs.stage == 'binary-prepublish' && needs.source-ci.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [greggd, gregg]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.75"
      - name: Build unpacked binary under Rust 1.75
        run: |
          set -euo pipefail
          mkdir -p evidence unpacked
          # Use --no-verify because gregg-protocol 1.0.1 is not yet on crates.io.
          cargo package -p "${{ matrix.crate }}" --no-verify
          archive="target/package/${{ matrix.crate }}-${{ needs.resolve.outputs.candidate_version }}.crate"
          tar -xzf "${archive}" -C unpacked
          package_dir="unpacked/${{ matrix.crate }}-${{ needs.resolve.outputs.candidate_version }}"
          # Configure temporary patch pointing to the exact candidate protocol source.
          protocol_dir="${PWD}/crates/gregg-protocol"
          cat >> "${package_dir}/Cargo.toml" <<EOF

          [patch.crates-io]
          gregg-protocol = { path = "${protocol_dir}" }
          EOF
          cargo generate-lockfile --manifest-path "${package_dir}/Cargo.toml"
          cp "${package_dir}/Cargo.lock" "evidence/${{ matrix.crate }}-Cargo.lock"
          cargo +1.75 build --manifest-path "${package_dir}/Cargo.toml" --all-features
          cargo +1.75 test --manifest-path "${package_dir}/Cargo.toml" --all-features | tee "evidence/${{ matrix.crate }}-msrv.txt"
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n '[{name:"Cargo.lock",role:"msrv-lockfile"},{name:"msrv.txt",role:"msrv-transcript"}]' > evidence/artifacts.json
          python3 scripts/validate-release-evidence.py write-candidate \
            --output evidence/candidate.json --candidate-sha "${{ needs.resolve.outputs.candidate_sha }}" \
            --release-version "${{ needs.resolve.outputs.candidate_version }}" --stage "binary-msrv-${{ matrix.crate }}" \
            --workflow-run-id "${GITHUB_RUN_ID}" --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --job-name "binary-msrv-${{ matrix.crate }}" --runner-os "${RUNNER_OS}" --runner-architecture "$(uname -m)" \
            --started-at "${now}" --completed-at "${now}" --artifacts-json evidence/artifacts.json --note "rust=1.75"
          python3 scripts/validate-release-evidence.py validate-candidate evidence/candidate.json \
            --expected-sha "${{ needs.resolve.outputs.candidate_sha }}" --expected-version "${{ needs.resolve.outputs.candidate_version }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msrv-${{ matrix.crate }}-${{ needs.resolve.outputs.short_sha }}-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: error

  native-evidence:
    name: Native platform evidence
    needs: [resolve, source-ci]
    if: ${{ inputs.stage == 'native-evidence' && needs.source-ci.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            expected_arch: x86_64
            name: linux-x86-64
          - runner: ubuntu-24.04-arm
            expected_arch: aarch64
            name: linux-arm64
          - runner: macos-15
            expected_arch: arm64
            name: macos-arm64
          - runner: macos-15-intel
            expected_arch: x86_64
            name: macos-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Initialize native evidence directory
        run: mkdir -p evidence
      - name: Assert native architecture and run gates
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.expected_arch }}"
          uname -a
          cargo test --workspace --all-targets --all-features | tee native-tests.txt
          cargo build --release -p greggd -p gregg
          if [[ "${{ matrix.name }}" == linux-* ]]; then
            cargo test -p greggd --all-features -- collector::linux
          else
            cargo test -p greggd --all-features -- collector::macos::ffi::native_tests
          fi
          bash scripts/verify-installed-daemon.sh target/release/greggd | tee native-daemon-verifier.txt
          if command -v sha256sum >/dev/null 2>&1; then sha256sum target/release/greggd target/release/gregg > native-binary.sha256; else shasum -a 256 target/release/greggd target/release/gregg > native-binary.sha256; fi
          if stat -c '%s' target/release/greggd >/dev/null 2>&1; then stat -c '%s' target/release/greggd > native-greggd.size; stat -c '%s' target/release/gregg > native-gregg.size; else stat -f '%z' target/release/greggd > native-greggd.size; stat -f '%z' target/release/gregg > native-gregg.size; fi
          cat native-binary.sha256
          target/release/greggd --version | tee native-greggd.version
          target/release/gregg --version | tee native-gregg.version
      - name: Candidate metadata
        run: |
          set -euo pipefail
          mkdir -p evidence
          cp native-tests.txt native-daemon-verifier.txt native-binary.sha256 native-greggd.size native-gregg.size native-greggd.version native-gregg.version evidence/
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n --arg archive "native-binary.sha256" --arg archive_sha "$(awk '/greggd$/{print $1}' native-binary.sha256)" --arg archive_size "$(cat native-greggd.size)" \
            '[{name:$archive,role:"binary-checksums",sha256:$archive_sha,size_bytes:$archive_size},{name:"native-tests.txt",role:"test-transcript"},{name:"native-daemon-verifier.txt",role:"daemon-verifier"}]' > evidence/artifacts.json
          python3 scripts/validate-release-evidence.py write-candidate \
            --output evidence/candidate.json --candidate-sha "${{ needs.resolve.outputs.candidate_sha }}" --release-version "1.0.1" \
            --stage "native-source-${{ matrix.name }}" --workflow-run-id "${GITHUB_RUN_ID}" --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --job-name "native-source-${{ matrix.name }}" --runner-os "${RUNNER_OS}" --runner-architecture "$(uname -m)" \
            --started-at "${now}" --completed-at "${now}" --artifacts-json evidence/artifacts.json \
            --executable greggd "$(awk '/greggd$/{print $1}' native-binary.sha256)" "$(cat native-greggd.size)" \
            --executable gregg "$(awk '/gregg$/{print $1}' native-binary.sha256)" "$(cat native-gregg.size)"
          python3 scripts/validate-release-evidence.py validate-candidate evidence/candidate.json \
            --expected-sha "${{ needs.resolve.outputs.candidate_sha }}" --expected-version "1.0.1" --expected-architecture "$(uname -m)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-source-${{ matrix.name }}-${{ needs.resolve.outputs.short_sha }}-${{ github.run_attempt }}
          path: |
            evidence
            native-*
          if-no-files-found: warn

  native-package-evidence:
    name: Package-native platform evidence
    needs: [resolve, source-ci]
    if: ${{ inputs.stage == 'native-evidence' && needs.source-ci.result == 'success' && inputs.package_run_id != '' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            expected_arch: x86_64
            name: linux-x86-64
          - runner: ubuntu-24.04-arm
            expected_arch: aarch64
            name: linux-arm64
          - runner: macos-15
            expected_arch: arm64
            name: macos-arm64
          - runner: macos-15-intel
            expected_arch: x86_64
            name: macos-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: binary-greggd-${{ needs.resolve.outputs.short_sha }}-${{ inputs.package_run_attempt }}
          run-id: ${{ inputs.package_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: package-artifact/greggd
      - uses: actions/download-artifact@v4
        with:
          name: binary-gregg-${{ needs.resolve.outputs.short_sha }}-${{ inputs.package_run_attempt }}
          run-id: ${{ inputs.package_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: package-artifact/gregg
      - name: Validate selected package run
        run: |
          set -euo pipefail
          test -d package-artifact/greggd/evidence
          test -d package-artifact/gregg/evidence
          greggd_archive="package-artifact/greggd/target/package/greggd-1.0.1.crate"
          gregg_archive="package-artifact/gregg/target/package/gregg-1.0.1.crate"
          greggd_provenance="package-artifact/greggd/evidence/package-provenance.json"
          gregg_provenance="package-artifact/gregg/evidence/package-provenance.json"
          greggd_lockfile="package-artifact/greggd/evidence/greggd-Cargo.lock"
          gregg_lockfile="package-artifact/gregg/evidence/gregg-Cargo.lock"
          test -f "${greggd_archive}" || greggd_archive="$(find package-artifact/greggd -type f -name 'greggd-1.0.1.crate' -print -quit)"
          test -f "${gregg_archive}" || gregg_archive="$(find package-artifact/gregg -type f -name 'gregg-1.0.1.crate' -print -quit)"
          test -f "${greggd_lockfile}" || greggd_lockfile="$(find package-artifact/greggd -type f -name 'Cargo.lock' -path '*evidence*' -print -quit)"
          test -f "${gregg_lockfile}" || gregg_lockfile="$(find package-artifact/gregg -type f -name 'Cargo.lock' -path '*evidence*' -print -quit)"
          test -n "${greggd_archive}" -a -n "${gregg_archive}" -a -f "${greggd_provenance}" -a -f "${gregg_provenance}" -a -n "${greggd_lockfile}" -a -n "${gregg_lockfile}"
          echo "greggd_archive=${greggd_archive}" >> "${GITHUB_ENV}"
          echo "gregg_archive=${gregg_archive}" >> "${GITHUB_ENV}"
          echo "greggd_provenance=${greggd_provenance}" >> "${GITHUB_ENV}"
          echo "gregg_provenance=${gregg_provenance}" >> "${GITHUB_ENV}"
          echo "greggd_lockfile=${greggd_lockfile}" >> "${GITHUB_ENV}"
          echo "gregg_lockfile=${gregg_lockfile}" >> "${GITHUB_ENV}"
      - name: Install and verify package-derived binaries
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.expected_arch }}"
          mkdir -p evidence
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          scripts/install-verified-package.sh --manifest "${greggd_provenance}" --package greggd --archive "${greggd_archive}" --version 1.0.1 --candidate-sha "${{ needs.resolve.outputs.candidate_sha }}" --root "${RUNNER_TEMP}/greggd-pkg" --lockfile "${greggd_lockfile}"
          scripts/install-verified-package.sh --manifest "${gregg_provenance}" --package gregg --archive "${gregg_archive}" --version 1.0.1 --candidate-sha "${{ needs.resolve.outputs.candidate_sha }}" --root "${RUNNER_TEMP}/gregg-pkg" --lockfile "${gregg_lockfile}"
          greggd_binary="${RUNNER_TEMP}/greggd-pkg/bin/greggd"
          gregg_binary="${RUNNER_TEMP}/gregg-pkg/bin/gregg"
          "${greggd_binary}" --version | tee evidence/greggd-version.txt
          "${gregg_binary}" --version | tee evidence/gregg-version.txt
          bash scripts/verify-installed-daemon.sh "${greggd_binary}" | tee evidence/daemon-verifier.txt
          "${gregg_binary}" --config evidence/client.toml add 127.0.0.1:9 --name pkg-smoke
          if command -v sha256sum >/dev/null 2>&1; then sha256sum "${greggd_binary}" "${gregg_binary}" > evidence/binary.sha256; else shasum -a 256 "${greggd_binary}" "${gregg_binary}" > evidence/binary.sha256; fi
          if stat -c '%s' "${greggd_binary}" >/dev/null 2>&1; then stat -c '%s' "${greggd_binary}" > evidence/greggd.size; stat -c '%s' "${gregg_binary}" > evidence/gregg.size; else stat -f '%z' "${greggd_binary}" > evidence/greggd.size; stat -f '%z' "${gregg_binary}" > evidence/gregg.size; fi
          completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n --arg archive "binary.sha256" --arg archive_sha "$(awk '/greggd$/{print $1}' evidence/binary.sha256)" --arg archive_size "$(cat evidence/greggd.size)" \
            '[{name:$archive,role:"binary-checksums",sha256:$archive_sha,size_bytes:$archive_size},{name:"daemon-verifier.txt",role:"daemon-verifier"},{name:"client.toml",role:"client-config"}]' > evidence/artifacts.json
          python3 scripts/validate-release-evidence.py write-candidate \
            --output evidence/candidate.json --candidate-sha "${{ needs.resolve.outputs.candidate_sha }}" --release-version "1.0.1" \
            --stage "native-package-${{ matrix.name }}" --workflow-run-id "${GITHUB_RUN_ID}" --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --job-name "native-package-${{ matrix.name }}" --runner-os "${RUNNER_OS}" --runner-architecture "$(uname -m)" \
            --started-at "${started_at}" --completed-at "${completed_at}" --artifacts-json evidence/artifacts.json \
            --executable greggd "$(awk '/greggd$/{print $1}' evidence/binary.sha256)" "$(cat evidence/greggd.size)" \
            --executable gregg "$(awk '/gregg$/{print $1}' evidence/binary.sha256)" "$(cat evidence/gregg.size)"
          python3 scripts/validate-release-evidence.py validate-candidate evidence/candidate.json \
            --expected-sha "${{ needs.resolve.outputs.candidate_sha }}" --expected-version "1.0.1" --expected-architecture "$(uname -m)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-package-${{ matrix.name }}-${{ needs.resolve.outputs.short_sha }}-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: error

  mixed-fleet-client:
    name: Mixed-fleet client state engine
    needs: [resolve, source-ci]
