  postpublish-verify:
    name: Postpublication registry installs
    needs: [resolve, protocol-index-check]
    if: ${{ always() && inputs.stage == 'postpublish-verify' && needs.protocol-index-check.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install and exercise published binaries
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.resolve.outputs.candidate_sha }}"
          mkdir -p evidence "${RUNNER_TEMP}/greggd" "${RUNNER_TEMP}/gregg"
          scripts/verify-candidate-identity.sh --mode tag --input v1.0.1 --candidate-sha "${{ needs.resolve.outputs.candidate_sha }}" --output evidence/tag-identity.json
          for crate in gregg-protocol greggd gregg; do
            curl --fail --silent --show-error "https://crates.io/api/v1/crates/${crate}/1.0.1" >"evidence/registry-${crate}.json"
            jq -e --arg crate "${crate}" '.version.num == "1.0.1" and .version.crate == $crate and .version.yanked == false and (.version.cksum | type == "string" and length == 64) and (.version.created_at | type == "string" and length > 0)' "evidence/registry-${crate}.json" >/dev/null
          done
          jq -s '[.[] | {crate:.version.crate,version:.version.num,checksum:.version.cksum,published_at:.version.created_at,yanked:.version.yanked}]' evidence/registry-*.json > evidence/registry-summary.json
          cargo install greggd --version '=1.0.1' --locked --root "${RUNNER_TEMP}/greggd" | tee evidence/greggd-install.txt
          cargo install gregg --version '=1.0.1' --locked --root "${RUNNER_TEMP}/gregg" | tee evidence/gregg-install.txt
          "${RUNNER_TEMP}/greggd/bin/greggd" --help | tee evidence/greggd-help.txt
          "${RUNNER_TEMP}/greggd/bin/greggd" --version | tee evidence/greggd-version.txt
          "${RUNNER_TEMP}/gregg/bin/gregg" --help | tee evidence/gregg-help.txt
          "${RUNNER_TEMP}/gregg/bin/gregg" --version | tee evidence/gregg-version.txt
          ./scripts/verify-installed-daemon.sh "${RUNNER_TEMP}/greggd/bin/greggd" | tee evidence/installed-daemon-verifier.txt
          client_config="${RUNNER_TEMP}/gregg.toml"
          "${RUNNER_TEMP}/gregg/bin/gregg" --config "${client_config}" add 127.0.0.1:9 --name registry-smoke
          test "$(stat -c '%a' "${client_config}")" = 600
          sha256sum "${RUNNER_TEMP}/greggd/bin/greggd" "${RUNNER_TEMP}/gregg/bin/gregg" | tee evidence/installed.sha256
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n '[{name:"registry-summary.json",role:"registry-summary"},{name:"installed-daemon-verifier.txt",role:"daemon-verifier"},{name:"installed.sha256",role:"binary-checksums"},{name:"greggd-install.txt",role:"greggd-install"},{name:"gregg-install.txt",role:"gregg-install"}]' > evidence/artifacts.json
          python3 scripts/materialize-release-evidence.py --artifact-list evidence/artifacts.json --root evidence --output evidence/role-index.json
          python3 scripts/validate-release-evidence.py write-candidate --output evidence/candidate.json --candidate-sha "${{ needs.resolve.outputs.candidate_sha }}" --release-version 1.0.1 --stage postpublish-verify --workflow-run-id "${GITHUB_RUN_ID}" --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" --job-name postpublish-verify --runner-os "${RUNNER_OS}" --runner-architecture "$(uname -m)" --started-at "${now}" --completed-at "${now}" --artifacts-json evidence/artifacts.json --executable greggd "$(awk '/greggd/{print $1}' evidence/installed.sha256)" "$(stat -c '%s' "${RUNNER_TEMP}/greggd/bin/greggd")" --executable gregg "$(awk '/gregg/{print $1}' evidence/installed.sha256)" "$(stat -c '%s' "${RUNNER_TEMP}/gregg/bin/gregg")"
          python3 scripts/validate-release-evidence.py validate-candidate evidence/candidate.json --expected-sha "${{ needs.resolve.outputs.candidate_sha }}" --expected-version 1.0.1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postpublish-${{ needs.resolve.outputs.short_sha }}-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: error

  aggregate:
    name: Aggregate candidate evidence
    needs: [resolve, source-ci, protocol-prepublish, protocol-index-check, binary-prepublish, binary-msrv, native-evidence, native-package-evidence, mixed-fleet-client, mixed-fleet-sustained, operational-evidence, operational-macos-evidence, systemd-lifecycle, launchd-lifecycle, postpublish-verify]
    if: ${{ always() && needs.resolve.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          path: evidence
          pattern: "*-${{ needs.resolve.outputs.short_sha }}-${{ github.run_attempt }}"
          merge-multiple: false
          if-no-artifact-found: error
      - name: Resolve dispatch-local required stages
        id: dispatch
        run: |
          set -euo pipefail
          python3 -c "
          import json, sys
          contract = json.load(open('plans/evidence/release-dispatch-contract.json'))
          stage = '${{ inputs.stage }}'
          entry = contract['dispatches'].get(stage)
          if entry is None:
              print(f'ERROR: unknown dispatch stage {stage}', file=sys.stderr)
              sys.exit(1)
          for s in entry['required_stages']:
              print(s)
          " > dispatch-stages.txt
      - name: Validate and aggregate metadata
        run: |
          set -euo pipefail
          required=()
          while IFS= read -r stage; do
            [[ -n "$stage" ]] && required+=("$stage")
          done < dispatch-stages.txt
          args=(--evidence-dir evidence --expected-sha "${{ needs.resolve.outputs.candidate_sha }}" --release-version "${{ needs.resolve.outputs.candidate_version }}" --output aggregate-candidate.json)
          for stage in "${required[@]}"; do args+=(--required-stage "${stage}"); done
          scripts/aggregate-release-evidence.sh "${args[@]}"
          # Merge three-crate package provenance when all binary packages are present.
          if [[ "${{ inputs.stage }}" == "binary-prepublish" ]]; then
            short_sha="${{ needs.resolve.outputs.short_sha }}"
            attempt="${{ github.run_attempt }}"
            protocol_provenance="evidence/protocol-prepublish-${short_sha}-${attempt}/evidence/package-provenance.json"
            daemon_provenance="evidence/binary-greggd-${short_sha}-${attempt}/evidence/package-provenance.json"
            client_provenance="evidence/binary-gregg-${short_sha}-${attempt}/evidence/package-provenance.json"
            if [[ -f "$protocol_provenance" && -f "$daemon_provenance" && -f "$client_provenance" ]]; then
              python3 scripts/merge-package-provenance.py \
                --protocol "$protocol_provenance" --daemon "$daemon_provenance" --client "$client_provenance" \
                --expected-sha "${{ needs.resolve.outputs.candidate_sha }}" --release-version "${{ needs.resolve.outputs.candidate_version }}" \
                --output evidence/v1.0.1-package-provenance.json
            fi
          fi
          cat aggregate-candidate.json
      - uses: actions/upload-artifact@v4
        with:
          name: aggregate-${{ needs.resolve.outputs.short_sha }}-${{ github.run_attempt }}
          path: aggregate-candidate.json
          if-no-files-found: error
