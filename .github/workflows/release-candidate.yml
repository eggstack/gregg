            sudo launchctl print system/com.eggstack.greggd
            sudo /usr/local/bin/greggd restart
            sudo launchctl print system/com.eggstack.greggd
            sudo /usr/local/bin/greggd croncheck
            sudo /usr/local/bin/greggd stop
          } 2>&1 | tee evidence/launchd-transcript.txt
          completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n '[{name:"launchd-transcript.txt",role:"lifecycle-transcript"},{name:"package-provenance.json",role:"package-provenance"},{name:"preflight.txt",role:"preflight"},{name:"launchd-cleanup.log",role:"cleanup"}]' > evidence/artifacts.json
          python3 scripts/validate-release-evidence.py write-candidate --output evidence/candidate.json --candidate-sha "${{ needs.resolve.outputs.candidate_sha }}" --release-version 1.0.1 --stage launchd-lifecycle --workflow-run-id "${GITHUB_RUN_ID}" --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" --job-name launchd-lifecycle --runner-os "${RUNNER_OS}" --runner-architecture "$(uname -m)" --started-at "${started_at}" --completed-at "${completed_at}" --artifacts-json evidence/artifacts.json
          python3 scripts/validate-release-evidence.py validate-candidate evidence/candidate.json --expected-sha "${{ needs.resolve.outputs.candidate_sha }}" --expected-version 1.0.1
