        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: binary-greggd-${{ needs.resolve.outputs.short_sha }}-${{ inputs.package_run_attempt }}
          run-id: ${{ inputs.package_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: package-artifact
      - id: gate-systemd
        name: Exercise native systemd lifecycle
        run: |
          set -euo pipefail
          test -n "${GREGG_SYSTEMD_HOST:-}"
          mkdir -p evidence
          export GREGG_SERVICE_NAME=greggd
          export GREGG_EXPECTED_PORT=11310
          export GREGG_MARKER_DIR="/tmp/gregg-release-run-systemd-${GITHUB_RUN_ID}"
          export GREGG_CLEANUP_LOG="evidence/systemd-cleanup.log"
          export GREGG_EXPECTED_SHA="${{ needs.resolve.outputs.candidate_sha }}"
          export GREGG_EXPECTED_VERSION="1.0.1"
          bash scripts/preflight-protected-host.sh 2>&1 | tee evidence/preflight.txt
          mkdir -p "${GREGG_MARKER_DIR}"
          archive="package-artifact/target/package/greggd-1.0.1.crate"
          provenance="package-artifact/evidence/package-provenance.json"
          test -f "${archive}" || archive="$(find package-artifact -type f -name 'greggd-1.0.1.crate' -print -quit)"
          test -f "${provenance}" || provenance="$(find package-artifact -type f -name package-provenance.json -print -quit)"
          test -f "${archive}" -a -f "${provenance}"
          scripts/install-verified-package.sh --manifest "${provenance}" --package greggd --archive "${archive}" --version 1.0.1 --candidate-sha "${{ needs.resolve.outputs.candidate_sha }}" --root "${RUNNER_TEMP}/greggd-systemd" --lockfile "package-artifact/evidence/greggd-Cargo.lock"
          binary="${RUNNER_TEMP}/greggd-systemd/bin/greggd"
          scripts/verify-package-provenance.sh --manifest "${provenance}" --package greggd --archive "${archive}" --binary "${binary}" --version 1.0.1 --candidate-sha "${{ needs.resolve.outputs.candidate_sha }}" --allow-platform-binary --output evidence/package-provenance.json
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            uname -a
            sudo packaging/install-linux.sh "${binary}"
            sudo systemctl enable --now greggd
            sudo systemctl is-active --quiet greggd
            curl --fail --silent http://127.0.0.1:11310/healthz
            sudo systemctl stop greggd
            if sudo systemctl is-active --quiet greggd; then exit 1; fi
            sudo systemctl start greggd
            sudo systemctl is-active --quiet greggd
            sudo systemctl restart greggd
            sudo systemctl is-active --quiet greggd
            sudo /usr/local/bin/greggd croncheck
            sudo systemctl stop greggd
            sudo /usr/local/bin/greggd croncheck
            sudo systemctl is-active --quiet greggd
            sudo systemctl disable --now greggd
          } 2>&1 | tee evidence/systemd-transcript.txt
          completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          now="${completed_at}"
          jq -n '[{name:"systemd-transcript.txt",role:"lifecycle-transcript"},{name:"package-provenance.json",role:"package-provenance"},{name:"preflight.txt",role:"preflight"},{name:"systemd-cleanup.log",role:"cleanup"}]' > evidence/artifacts.json
          python3 scripts/validate-release-evidence.py write-candidate --output evidence/candidate.json --candidate-sha "${{ needs.resolve.outputs.candidate_sha }}" --release-version 1.0.1 --stage systemd-lifecycle --workflow-run-id "${GITHUB_RUN_ID}" --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" --job-name systemd-lifecycle --runner-os "${RUNNER_OS}" --runner-architecture "$(uname -m)" --started-at "${started_at}" --completed-at "${completed_at}" --artifacts-json evidence/artifacts.json
          python3 scripts/validate-release-evidence.py validate-candidate evidence/candidate.json --expected-sha "${{ needs.resolve.outputs.candidate_sha }}" --expected-version 1.0.1
      - id: cleanup-systemd
        if: always()
        name: Cleanup protected host
        run: |
          set -euo pipefail
          export GREGG_SERVICE_NAME=greggd
          export GREGG_EXPECTED_PORT=11310
          export GREGG_MARKER_DIR="/tmp/gregg-release-run-systemd-${GITHUB_RUN_ID}"
          export GREGG_CLEANUP_LOG="evidence/systemd-cleanup.log"
          bash scripts/cleanup-protected-host.sh
      - name: Enforce protected-host verdict
        if: always()
        run: |
          gate_outcome="${{ steps.gate-systemd.outcome }}"
          cleanup_outcome="${{ steps.cleanup-systemd.outcome }}"
          if [[ "${gate_outcome}" != "success" ]]; then
            echo "FATAL: gate step outcome was ${gate_outcome}" >&2
          fi
          if [[ "${cleanup_outcome}" != "success" ]]; then
            echo "FATAL: cleanup step outcome was ${cleanup_outcome}" >&2
          fi
          test "${gate_outcome}" = "success"
          test "${cleanup_outcome}" = "success"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: systemd-${{ needs.resolve.outputs.short_sha }}-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: error

  launchd-lifecycle:
    name: Protected launchd lifecycle
    needs: resolve
    if: ${{ inputs.stage == 'operational-evidence' && inputs.package_run_id != '' }}
    runs-on: [self-hosted, macos, gregg-launchd]
    environment: gregg-launchd
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: binary-greggd-${{ needs.resolve.outputs.short_sha }}-${{ inputs.package_run_attempt }}
          run-id: ${{ inputs.package_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
