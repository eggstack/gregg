  mixed-fleet-sustained:
    name: Mixed-fleet sustained evidence
    needs: [resolve, source-ci]
    if: ${{ inputs.stage == 'mixed-fleet-sustained' && needs.source-ci.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
      - name: Initialize evidence directory
        run: mkdir -p evidence
      - name: Build and run sustained workload
        run: |
          set -euo pipefail
          python3 scripts/run-mixed-fleet-sustained.py \
            --duration-seconds 30 \
            --sample-interval-seconds 5 \
            --evidence-dir evidence \
            --profile debug
      - name: Run short scheduler/state/poller unit tests
        run: |
          set -euo pipefail
          cargo test -p gregg --all-targets --all-features scheduler -- --nocapture 2>&1 | tee evidence/scheduler-tests.txt
          cargo test -p gregg --all-targets --all-features state -- --nocapture 2>&1 | tee evidence/state-tests.txt
          cargo test -p gregg --all-targets --all-features poller -- --nocapture 2>&1 | tee evidence/poller-tests.txt
      - name: Candidate metadata
        run: |
          set -euo pipefail
          mkdir -p evidence
          # Read actual values from the sustained summary.
          summary="evidence/sustained-summary.json"
          requested_duration="$(python3 -c "import json; d=json.load(open('${summary}')); print(d['requested_duration_secs'])")"
          observed_duration="$(python3 -c "import json; d=json.load(open('${summary}')); print(d['observed_duration_secs'])")"
          completed_generations="$(python3 -c "import json; d=json.load(open('${summary}')); print(d['completed_generations'])")"
          resource_sample_count="$(wc -l < evidence/resource-samples.jsonl 2>/dev/null || echo 0)"
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n \
            --arg requested "${requested_duration}" \
            --arg observed "${observed_duration}" \
            --arg generations "${completed_generations}" \
            --arg samples "${resource_sample_count}" \
            '[{name:"sustained-summary.json",role:"sustained-summary"},{name:"resource-samples.jsonl",role:"resource-samples"},{name:"workload-stdout.txt",role:"workload-stdout"},{name:"workload-stderr.txt",role:"workload-stderr"},{name:"scheduler-tests.txt",role:"scheduler-tests"},{name:"state-tests.txt",role:"state-tests"},{name:"poller-tests.txt",role:"poller-tests"}]' > evidence/artifacts.json
          python3 scripts/validate-release-evidence.py write-candidate \
            --output evidence/candidate.json --candidate-sha "${{ needs.resolve.outputs.candidate_sha }}" \
            --release-version "${{ needs.resolve.outputs.candidate_version }}" --stage mixed-fleet-sustained \
            --workflow-run-id "${GITHUB_RUN_ID}" --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --job-name mixed-fleet-sustained --runner-os "${RUNNER_OS}" --runner-architecture "$(uname -m)" \
            --started-at "${started_at}" --completed-at "${completed_at}" --artifacts-json evidence/artifacts.json \
            --note "requested_duration_secs=${requested_duration}" \
            --note "observed_duration_secs=${observed_duration}" \
            --note "resource_sample_count=${resource_sample_count}" \
            --note "completed_generations=${completed_generations}"
          python3 scripts/validate-release-evidence.py validate-candidate evidence/candidate.json \
            --expected-sha "${{ needs.resolve.outputs.candidate_sha }}" --expected-version "${{ needs.resolve.outputs.candidate_version }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mixed-fleet-sustained-${{ needs.resolve.outputs.short_sha }}-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: error

