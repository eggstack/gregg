name: release-candidate

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: "Git ref (commit SHA or tag) to verify"
        required: true
        type: string
      run_soak:
        description: "Run 24-hour soak tests (Linux and macOS)"
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  package-verification:
    name: Package verification — ${{ matrix.crate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [gregg-protocol, greggd, gregg]
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref }}
          fetch-depth: 0

      - name: Verify checked-out commit matches candidate
        run: |
          CHECKED_OUT="$(git rev-parse HEAD)"
          if [ "$CHECKED_OUT" != "${{ inputs.candidate_ref }}" ]; then
            echo "ERROR: checked-out commit $CHECKED_OUT does not match candidate ${{ inputs.candidate_ref }}"
            exit 1
          fi
          echo "Verified: $CHECKED_OUT"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rc-${{ matrix.crate }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rc-${{ matrix.crate }}-

      - name: Record environment
        run: |
          echo "=== Commit SHA ==="
          git rev-parse HEAD
          echo "=== Rust version ==="
          rustc -vV
          cargo --version
          echo "=== OS and architecture ==="
          uname -a
          uname -m
          echo "=== Cargo metadata ==="
          cargo metadata --format-version 1 | head -c 2000

      - name: List package contents
        run: cargo package -p ${{ matrix.crate }} --list

      - name: Build package archive
        run: cargo package -p ${{ matrix.crate }}

      - name: Locate and checksum archive
        run: |
          CRATE_NAME="${{ matrix.crate }}"
          VERSION="$(cargo metadata --format-version 1 | jq -r '.packages[] | select(.name == "'"$CRATE_NAME"'") | .version')"
          ARCHIVE="target/package/${CRATE_NAME}-${VERSION}.crate"
          echo "Archive: $ARCHIVE"
          sha256sum "$ARCHIVE"
          echo "ARCHIVE_PATH=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Unpack archive into clean directory
        run: |
          mkdir -p /tmp/${{ matrix.crate }}-verify
          tar -xzf "$ARCHIVE_PATH" -C /tmp/${{ matrix.crate }}-verify
          echo "=== Unpacked contents ==="
          ls -la /tmp/${{ matrix.crate }}-verify/

      - name: Inspect normalized Cargo.toml
        run: |
          echo "=== Normalized Cargo.toml ==="
          cat /tmp/${{ matrix.crate }}-verify/*/Cargo.toml

      - name: Build unpacked source
        run: |
          cd /tmp/${{ matrix.crate }}-verify/*/
          cargo build --all-features 2>&1

      - name: Test unpacked source
        run: |
          cd /tmp/${{ matrix.crate }}-verify/*/
          cargo test --all-features 2>&1

      - name: Install binary from clean root (greggd and gregg only)
        if: matrix.crate != 'gregg-protocol'
        run: |
          TEMP_ROOT="/tmp/${{ matrix.crate }}-install"
          mkdir -p "$TEMP_ROOT"
          cd /tmp/${{ matrix.crate }}-verify/*/
          cargo install --path . --locked --root "$TEMP_ROOT" 2>&1
          echo "=== Installed binaries ==="
          ls -la "$TEMP_ROOT/bin/"

      - name: Smoke test installed binary (greggd and gregg only)
        if: matrix.crate != 'gregg-protocol'
        run: |
          TEMP_ROOT="/tmp/${{ matrix.crate }}-install"
          "$TEMP_ROOT/bin/${{ matrix.crate }}" --help 2>&1
          if [ "${{ matrix.crate }}" = "greggd" ]; then
            "$TEMP_ROOT/bin/greggd" --version 2>&1
          fi

  msrv-package:
    name: MSRV package build — ${{ matrix.crate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [gregg-protocol, greggd, gregg]
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref }}
          fetch-depth: 0

      - name: Verify checked-out commit matches candidate
        run: |
          CHECKED_OUT="$(git rev-parse HEAD)"
          if [ "$CHECKED_OUT" != "${{ inputs.candidate_ref }}" ]; then
            echo "ERROR: checked-out commit $CHECKED_OUT does not match candidate ${{ inputs.candidate_ref }}"
            exit 1
          fi

      - name: Install Rust 1.75
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.75"

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rc-msrv-${{ matrix.crate }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rc-msrv-${{ matrix.crate }}-

      - name: Build unpacked protocol package under Rust 1.75
        if: matrix.crate == 'gregg-protocol'
        run: |
          cargo package -p ${{ matrix.crate }}
          ARCHIVE="target/package/${{ matrix.crate }}-$(cargo metadata --format-version 1 | jq -r '.packages[] | select(.name == "${{ matrix.crate }}") | .version').crate"
          mkdir -p /tmp/msrv-verify
          tar -xzf "$ARCHIVE" -C /tmp/msrv-verify
          cd /tmp/msrv-verify/*/
          cargo build --all-features 2>&1

      - name: Build unpacked binary package under Rust 1.75
        if: matrix.crate != 'gregg-protocol'
        run: |
          cargo package -p ${{ matrix.crate }}
          ARCHIVE="target/package/${{ matrix.crate }}-$(cargo metadata --format-version 1 | jq -r '.packages[] | select(.name == "${{ matrix.crate }}") | .version').crate"
          mkdir -p /tmp/msrv-verify
          tar -xzf "$ARCHIVE" -C /tmp/msrv-verify
          cd /tmp/msrv-verify/*/
          cargo build --all-features 2>&1

  native-evidence:
    name: Native evidence — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            name: linux-x86_64
          - os: macos-15
            arch: arm64
            name: macos-arm64
          - os: macos-15-intel
            arch: x86_64
            name: macos-intel
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref }}
          fetch-depth: 0

      - name: Verify checked-out commit matches candidate
        run: |
          CHECKED_OUT="$(git rev-parse HEAD)"
          if [ "$CHECKED_OUT" != "${{ inputs.candidate_ref }}" ]; then
            echo "ERROR: checked-out commit $CHECKED_OUT does not match candidate ${{ inputs.candidate_ref }}"
            exit 1
          fi

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rc-native-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rc-native-

      - name: Verify architecture
        run: |
          OBSERVED="$(uname -m)"
          if [ "$OBSERVED" != "${{ matrix.arch }}" ]; then
            echo "ERROR: expected arch ${{ matrix.arch }}, got $OBSERVED"
            exit 1
          fi

      - name: Full workspace test
        run: cargo test --workspace --all-targets --all-features

      - name: Native collector smoke
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            cargo test -p greggd --all-features -- collector::linux
          else
            cargo test -p greggd --all-features -- collector::macos::ffi::native_tests
          fi

      - name: Release build
        run: cargo build --release -p greggd -p gregg

      - name: Daemon loopback smoke
        run: |
          cargo build --release -p greggd
          /tmp/greggd-loopback-test.sh 2>&1 || true

  soak:
    name: 24-hour soak
    runs-on: ubuntu-latest
    needs: [package-verification, native-evidence]
    if: inputs.run_soak == true
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run soak test
        run: |
          ./scripts/soak-test.sh 2>&1
