name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.os }} ${{ matrix.toolchain }} ${{ matrix.expected_arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: stable
            expected_arch: x86_64
          - os: macos-15
            toolchain: stable
            expected_arch: arm64
          - os: macos-15-intel
            toolchain: stable
            expected_arch: x86_64

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Verify architecture
        run: |
          echo "Observed architecture: $(uname -m)"
          echo "Rust version:"
          rustc -vV
          OBSERVED="$(uname -m)"
          if [ "$OBSERVED" != "${{ matrix.expected_arch }}" ]; then
            echo "ERROR: expected arch ${{ matrix.expected_arch }}, got $OBSERVED"
            exit 1
          fi

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets --all-features

      - name: Doc
        run: cargo doc --workspace --no-deps

      - name: Native macOS collector smoke
        if: runner.os == 'macOS'
        run: |
          cargo test -p greggd --all-features -- collector::macos::ffi::native_tests

      - name: Native Linux collector smoke
        if: runner.os == 'Linux'
        run: |
          cargo test -p greggd --all-features -- collector::linux

      - name: Shellcheck installer scripts
        if: runner.os == 'Linux'
        run: shellcheck packaging/install-linux.sh packaging/install-macos.sh

      - name: Deny
        if: runner.os == 'Linux'
        uses: EmbarkStudios/cargo-deny-action@v2

  msrv:
    name: MSRV check
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install Rust 1.75
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.75"

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-msrv-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-msrv-cargo-

      - name: Check compilation
        run: cargo check --workspace --all-features
