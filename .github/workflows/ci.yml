name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.os }} ${{ matrix.toolchain }} ${{ matrix.expected_arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: stable
            expected_arch: x86_64
          - os: macos-15
            toolchain: stable
            expected_arch: arm64
          - os: macos-15-intel
            toolchain: stable
            expected_arch: x86_64

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Verify architecture
        run: |
          echo "Observed architecture: $(uname -m)"
          echo "Rust version:"
          rustc -vV
          OBSERVED="$(uname -m)"
          if [ "$OBSERVED" != "${{ matrix.expected_arch }}" ]; then
            echo "ERROR: expected arch ${{ matrix.expected_arch }}, got $OBSERVED"
            exit 1
          fi

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets --all-features

      - name: Doc
        run: cargo doc --workspace --no-deps

      - name: Package gregg-protocol
        run: cargo package -p gregg-protocol

      - name: Package greggd
        run: cargo package -p greggd

      - name: Package gregg
        run: cargo package -p gregg

      - name: Inspect package contents
        run: |
          cargo package -p gregg-protocol --list
          cargo package -p greggd --list
          cargo package -p gregg --list

      - name: Unpack and build packages
        run: |
          TMPDIR=$(mktemp -d)
          for crate in gregg-protocol greggd gregg; do
            cargo package -p $crate
            CRATE_FILE=$(ls -t $crate-*.crate | head -1)
            mkdir -p "$TMPDIR/$crate"
            tar xf "$CRATE_FILE" -C "$TMPDIR/$crate"
            echo "=== Contents of $crate ==="
            ls -la "$TMPDIR/$crate"/*
          done
          rm -rf "$TMPDIR"

      - name: Install binary crates from packages
        run: |
          TMPDIR=$(mktemp -d)
          for crate in greggd gregg; do
            cargo package -p $crate
            CRATE_FILE=$(ls -t $crate-*.crate | head -1)
            mkdir -p "$TMPDIR/$crate"
            tar xf "$CRATE_FILE" -C "$TMPDIR/$crate"
            INSTALL_DIR="$TMPDIR/install-$crate"
            mkdir -p "$INSTALL_DIR"
            cargo install --path "$TMPDIR/$crate"/* --root "$INSTALL_DIR" --locked
          done
          rm -rf "$TMPDIR"

      - name: Smoke test installed binaries
        run: |
          TMPDIR=$(mktemp -d)
          for crate in greggd gregg; do
            cargo package -p $crate
            CRATE_FILE=$(ls -t $crate-*.crate | head -1)
            mkdir -p "$TMPDIR/$crate"
            tar xf "$CRATE_FILE" -C "$TMPDIR/$crate"
            INSTALL_DIR="$TMPDIR/install-$crate"
            mkdir -p "$INSTALL_DIR"
            cargo install --path "$TMPDIR/$crate"/* --root "$INSTALL_DIR" --locked
          done
          "$TMPDIR/install-greggd/bin/greggd" --help
          "$TMPDIR/install-greggd/bin/greggd" run --help
          "$TMPDIR/install-gregg/bin/gregg" --help
          "$TMPDIR/install-gregg/bin/gregg" list
          rm -rf "$TMPDIR"

      - name: Native macOS collector smoke
        if: runner.os == 'macOS'
        run: |
          cargo test -p greggd --all-features -- collector::macos::ffi::native_tests

      - name: Native Linux collector smoke
        if: runner.os == 'Linux'
        run: |
          cargo test -p greggd --all-features -- collector::linux

      - name: Shellcheck installer scripts
        if: runner.os == 'Linux'
        uses: ludeeus/shellcheck-action@v1.3.0
        with:
          scripts: packaging/install-linux.sh packaging/install-macos.sh
          shell: bash

      - name: Deny
        if: runner.os == 'Linux'
        uses: EmbarkStudios/cargo-deny-action@v2

  msrv:
    name: MSRV check
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install Rust 1.75
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.75"

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-msrv-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-msrv-cargo-

      - name: Check compilation
        run: cargo check --workspace --all-features

      - name: Package build under MSRV
        run: |
          cargo package -p gregg-protocol
          cargo package -p greggd
          cargo package -p gregg
