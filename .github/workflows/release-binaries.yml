  build-windows:
    name: Windows x86_64
    needs: preflight
    runs-on: windows-2022
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build gregg and greggd
        shell: pwsh
        run: cargo build --release --locked -p gregg -p greggd

      - name: Stage assets with public names
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target/release/gregg.exe dist/gregg-x86_64-pc-windows-msvc.exe -Force
          Copy-Item target/release/greggd.exe dist/greggd-x86_64-pc-windows-msvc.exe -Force
          Get-ChildItem dist | Format-List Name,Length

      - name: Smoke - version and help
        shell: pwsh
        run: |
          $version = "${{ needs.preflight.outputs.version }}"
          & ./dist/gregg-x86_64-pc-windows-msvc.exe version
          if ($LASTEXITCODE -ne 0) { throw "gregg version failed" }
          $out = & ./dist/gregg-x86_64-pc-windows-msvc.exe version
          if ($out -notmatch "gregg $version") { throw "gregg version mismatch: $out vs $version" }
          & ./dist/gregg-x86_64-pc-windows-msvc.exe --help
          if ($LASTEXITCODE -ne 0) { throw "gregg --help failed" }
          & ./dist/greggd-x86_64-pc-windows-msvc.exe version
          if ($LASTEXITCODE -ne 0) { throw "greggd version failed" }
          $out2 = & ./dist/greggd-x86_64-pc-windows-msvc.exe version
          if ($out2 -notmatch "greggd $version") { throw "greggd version mismatch: $out2 vs $version" }
          & ./dist/greggd-x86_64-pc-windows-msvc.exe --help
          if ($LASTEXITCODE -ne 0) { throw "greggd --help failed" }

      - name: Daemon loopback smoke
        shell: pwsh
        run: |
          $tmp = Join-Path $env:TEMP "greggd-smoke-$(Get-Random)"
          $config = Join-Path $tmp "greggd.toml"
          $port = 11399
          New-Item -ItemType Directory -Path $tmp -Force | Out-Null
          @"
          name = "release-smoke"
          host = "127.0.0.1"
          port = $port
          sample_interval_ms = 250
          stale_after_ms = 10000
          "@ | Set-Content -LiteralPath $config
          $proc = Start-Process -FilePath "$PWD/dist/greggd-x86_64-pc-windows-msvc.exe" -ArgumentList @('--config', "`"$config`"", 'run') -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            $deadline = (Get-Date).AddSeconds(15)
            while ((Get-Date) -lt $deadline) {
              if ($proc.HasExited) { throw "greggd exited during startup" }
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:$port/v2/healthz" -TimeoutSec 2
                if ($health.state -eq 'ready') { $ready = $true; break }
              } catch { }
              Start-Sleep -Milliseconds 200
            }
            if (-not $ready) { throw "greggd did not become ready within 15s" }
            $status = Invoke-RestMethod -Uri "http://127.0.0.1:$port/v2/status" -TimeoutSec 2
            if ($status.schema_version -ne 2) { throw "unexpected schema_version" }
            Write-Host "Windows daemon smoke passed"
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue; $proc.WaitForExit(5000) }
            Remove-Item -LiteralPath $tmp -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          Set-Location dist
          $greggHash = (Get-FileHash -Algorithm SHA256 -Path gregg-x86_64-pc-windows-msvc.exe).Hash.ToLower()
          $gregdHash = (Get-FileHash -Algorithm SHA256 -Path greggd-x86_64-pc-windows-msvc.exe).Hash.ToLower()
          "$greggHash  gregg-x86_64-pc-windows-msvc.exe" | Set-Content -NoNewline -Path gregg-x86_64-pc-windows-msvc.exe.sha256 -Encoding ASCII
          Add-Content -Path gregg-x86_64-pc-windows-msvc.exe.sha256 -Value "" -NoNewline
          # Rebuild with proper format (hash + two spaces + filename)
          Set-Content -Path gregg-x86_64-pc-windows-msvc.exe.sha256 -Value "$greggHash  gregg-x86_64-pc-windows-msvc.exe" -NoNewline
          Set-Content -Path greggd-x86_64-pc-windows-msvc.exe.sha256 -Value "$gregdHash  greggd-x86_64-pc-windows-msvc.exe" -NoNewline
          Get-Content gregg-x86_64-pc-windows-msvc.exe.sha256
          Get-Content greggd-x86_64-pc-windows-msvc.exe.sha256
          # Verify
          $check1 = (Get-FileHash -Algorithm SHA256 -Path gregg-x86_64-pc-windows-msvc.exe).Hash.ToLower()
          $listed1 = (Get-Content gregg-x86_64-pc-windows-msvc.exe.sha256).Split()[0].ToLower()
          if ($check1 -ne $listed1) { throw "gregg checksum mismatch" }
          $check2 = (Get-FileHash -Algorithm SHA256 -Path greggd-x86_64-pc-windows-msvc.exe).Hash.ToLower()
          $listed2 = (Get-Content greggd-x86_64-pc-windows-msvc.exe.sha256).Split()[0].ToLower()
          if ($check2 -ne $listed2) { throw "greggd checksum mismatch" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/*
          if-no-files-found: error

  assemble-release:
    name: Assemble draft GitHub Release
    needs:
      - preflight
      - build-linux-x86_64
      - build-linux-aarch64
      - build-macos-intel
      - build-macos-arm
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.tag || github.ref }}

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List staged assets
        shell: bash
        run: |
          set -euo pipefail
          ls -lh dist/
          echo "--- validating expected asset names ---"
          # Expected names derive from scripts/release-targets.txt so the
          # workflow, installers, and Rust updater share one target table.
          bash scripts/release-check-assets.sh dist

      - name: Verify installers exist
        shell: bash
        run: |
          set -euo pipefail
          ls -lh packaging/install.sh packaging/install.ps1
          bash -n packaging/install.sh
          echo "install.sh syntax OK"
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck packaging/install.sh || echo "shellcheck warnings (non-fatal for CI)"
          fi

      - name: Assemble draft release (idempotent, never auto-publish)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ needs.preflight.outputs.tag }}"
          VERSION="${{ needs.preflight.outputs.version }}"
          echo "Assembling draft release for $TAG (version $VERSION)"

          # Ensure gh is available
          gh --version

          # Prepare file list: executables, checksums, installers
          mapfile -t ASSETS < <(ls dist/*)
          ASSETS+=("packaging/install.sh")
          ASSETS+=("packaging/install.ps1")
          echo "Assets to upload:"
          printf '  %s\n' "${ASSETS[@]}"

          # Check current release state
          set +e
          gh release view "$TAG" --json isDraft,isPrerelease,name,tagName 2>/tmp/gh_view.err
          VIEW_STATUS=$?
          set -e
          if [[ $VIEW_STATUS -ne 0 ]]; then
            if grep -q "release not found" /tmp/gh_view.err 2>/dev/null; then
              echo "No release exists for $TAG; creating DRAFT release"
              gh release create "$TAG" \
                --draft \
                --title "Gregg $VERSION" \
                --notes "Prebuilt binaries for Gregg $VERSION.

          Install (Linux/macOS):
            curl -fsSL https://github.com/eggstack/gregg/releases/latest/download/install.sh | bash -s -- gregg
            curl -fsSL https://github.com/eggstack/gregg/releases/latest/download/install.sh | sudo bash -s -- greggd
            curl -fsSL https://github.com/eggstack/gregg/releases/latest/download/install.sh | sudo bash -s -- both

          Install (Windows PowerShell):
            irm https://github.com/eggstack/gregg/releases/latest/download/install.ps1 | iex

          Or download the matching asset for your platform from the assets below and verify its .sha256.
          See packaging/README.md for details. Binaries are unsigned; macOS may gate them via quarantine." \
                "${ASSETS[@]}"
            else
              echo "Failed to query release state for $TAG" >&2
              cat /tmp/gh_view.err >&2
              exit 1
            fi
          else
            IS_DRAFT="$(gh release view "$TAG" --json isDraft -q .isDraft)"
            if [[ "$IS_DRAFT" == "true" ]]; then
              echo "Draft release for $TAG already exists; uploading assets with --clobber"
              gh release upload "$TAG" "${ASSETS[@]}" --clobber
            else
              echo "error: release $TAG already exists and is not a draft (published)" >&2
              echo "Refusing to silently replace published binaries." >&2
              echo "If a new patch is needed, bump the workspace version and create a new tag." >&2
              exit 1
            fi
          fi
          echo "Draft release assembled for $TAG"
          gh release view "$TAG" --json tagName,name,isDraft,assets --jq '{tag: .tagName, title: .name, draft: .isDraft, assets: [.assets[].name]}'
