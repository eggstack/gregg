          path: dist/*
          if-no-files-found: error

  build-macos-arm:
    name: macOS Apple Silicon (aarch64)
    needs: preflight
    runs-on: macos-15
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build gregg and greggd
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked -p gregg -p greggd

      - name: Stage assets with public names
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/gregg dist/gregg-aarch64-apple-darwin
          cp target/release/greggd dist/greggd-aarch64-apple-darwin
          chmod +x dist/gregg-aarch64-apple-darwin dist/greggd-aarch64-apple-darwin
