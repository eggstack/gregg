          ./dist/gregg-x86_64-apple-darwin version
          ./dist/gregg-x86_64-apple-darwin version | grep -q "gregg $VERSION"
          ./dist/gregg-x86_64-apple-darwin --help
          ./dist/greggd-x86_64-apple-darwin version
          ./dist/greggd-x86_64-apple-darwin version | grep -q "greggd $VERSION"
          ./dist/greggd-x86_64-apple-darwin --help

      - name: Daemon loopback smoke
        shell: bash
        run: |
          set -euo pipefail
          if [[ -x scripts/verify-installed-daemon.sh ]]; then
            bash scripts/verify-installed-daemon.sh dist/greggd-x86_64-apple-darwin
          else
            TMPDIR="$(mktemp -d)"
            CONFIG="$TMPDIR/greggd.toml"
            PORT=11399
            cat >"$CONFIG" <<EOF
          name = "release-smoke"
          host = "127.0.0.1"
          port = $PORT
          sample_interval_ms = 250
          stale_after_ms = 10000
          EOF
            ./dist/greggd-x86_64-apple-darwin --config "$CONFIG" run &
