          ./dist/gregg-aarch64-unknown-linux-gnu --help
          ./dist/greggd-aarch64-unknown-linux-gnu version
          ./dist/greggd-aarch64-unknown-linux-gnu version | grep -q "greggd $VERSION"
          ./dist/greggd-aarch64-unknown-linux-gnu --help

      - name: Daemon loopback smoke (native)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -x scripts/verify-installed-daemon.sh ]]; then
            bash scripts/verify-installed-daemon.sh dist/greggd-aarch64-unknown-linux-gnu
          else
            TMPDIR="$(mktemp -d)"
            CONFIG="$TMPDIR/greggd.toml"
            PORT=11399
            cat >"$CONFIG" <<EOF
          name = "release-smoke"
          host = "127.0.0.1"
          port = $PORT
          sample_interval_ms = 250
          stale_after_ms = 10000
          EOF
            ./dist/greggd-aarch64-unknown-linux-gnu --config "$CONFIG" run &
            PID=$!
            trap 'kill $PID 2>/dev/null; wait $PID 2>/dev/null; rm -rf "$TMPDIR"' EXIT
            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:$PORT/v2/healthz" | grep -q '"state":"ready"'; then
                break
              fi
              sleep 0.5
            done
            curl -fsS "http://127.0.0.1:$PORT/v2/healthz" | grep -q '"schema_version":2'
            curl -fsS "http://127.0.0.1:$PORT/v2/status" | grep -q '"schema_version":2'
            kill $PID
            wait $PID
            rm -rf "$TMPDIR"
            trap - EXIT
          fi

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum gregg-aarch64-unknown-linux-gnu > gregg-aarch64-unknown-linux-gnu.sha256
          sha256sum greggd-aarch64-unknown-linux-gnu > greggd-aarch64-unknown-linux-gnu.sha256
          cat gregg-aarch64-unknown-linux-gnu.sha256
          cat greggd-aarch64-unknown-linux-gnu.sha256
          sha256sum -c gregg-aarch64-unknown-linux-gnu.sha256
          sha256sum -c greggd-aarch64-unknown-linux-gnu.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64
          path: dist/*
          if-no-files-found: error

  build-macos-intel:
    name: macOS Intel (x86_64)
    needs: preflight
    runs-on: macos-15-intel
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
