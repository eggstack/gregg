name: release-binaries

# Release-only pipeline that builds, verifies, and attaches prebuilt gregg/greggd
# executables for the supported OS/architecture matrix. Ordinary CI remains in
# ci.yml and never builds release artifacts.
#
# Target / asset contract (Plan 099, Phase 1):
#
#   (os, arch)        Rust target                     Asset suffix                     Ext
#   linux  x86_64      x86_64-unknown-linux-gnu        x86_64-unknown-linux-gnu        ""
#   linux  aarch64     aarch64-unknown-linux-gnu       aarch64-unknown-linux-gnu       ""
#   macos  x86_64      x86_64-apple-darwin             x86_64-apple-darwin             ""
#   macos  arm64       aarch64-apple-darwin            aarch64-apple-darwin            ""
#   windows x86_64     x86_64-pc-windows-msvc          x86_64-pc-windows-msvc         ".exe"
#
# The public asset name is `<program>-<target>[.exe]` without a version
# qualifier; the GitHub release tag `vX.Y.Z` already provides the version
# namespace. SHA-256 files are `<asset>.sha256`. Installers use exactly the
# same suffixes.
#
# Linux portability floor: glibc 2.17 for both GNU targets. Release-only
# builds use cargo-zigbuild + Zig targeting `<target>.2.17`; the public
# suffix remains the ordinary Rust target.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g., v1.0.11). Required for manual dispatch.'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Preflight (version & tag)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.tag || github.ref }}

      - name: Derive tag and workspace version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # Derive the triggering tag. For push events github.ref is refs/tags/vX.Y.Z;
          # for dispatch we use the explicit input.
          if [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [[ "$TAG" != v* ]]; then
            echo "error: tag must start with 'v' (got '$TAG')" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Derived TAG=$TAG VERSION=$VERSION"

          # Read workspace version from Cargo.toml [workspace.package].
          WORKSPACE_VERSION="$(awk '
            /^\[workspace\.package\][[:space:]]*$/ { in_package=1; next }
            in_package && /^\[/ { exit }
            in_package && /^[[:space:]]*version[[:space:]]*=/ {
              if (match($0, /"[^"]+"/)) {
                print substr($0, RSTART + 1, RLENGTH - 2)
                exit
              }
            }
          ' Cargo.toml)"
          if [[ -z "$WORKSPACE_VERSION" ]]; then
            echo "error: could not read [workspace.package].version from Cargo.toml" >&2
            exit 1
          fi
          echo "Workspace version: $WORKSPACE_VERSION"
          if [[ "$VERSION" != "$WORKSPACE_VERSION" ]]; then
            echo "error: tag version v$VERSION does not match workspace version $WORKSPACE_VERSION" >&2
            exit 1
          fi

          # Verify every member manifests inherit the workspace version.
          for crate in crates/gregg-protocol crates/greggd crates/gregg; do
            manifest="$crate/Cargo.toml"
            if ! grep -Eq '^[[:space:]]*version\.workspace[[:space:]]*=[[:space:]]*true[[:space:]]*$' "$manifest"; then
              echo "error: $manifest missing version.workspace = true" >&2
              exit 1
            fi
          done

          # Verify gregg-protocol dependency versions match workspace version.
          for crate in crates/greggd crates/gregg; do
            manifest="$crate/Cargo.toml"
            dep_version="$(grep -E '^[[:space:]]*gregg-protocol[[:space:]]*=' "$manifest" | head -1 | sed -E 's/.*version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')"
            if [[ -z "$dep_version" ]]; then
              echo "error: $manifest has no gregg-protocol version" >&2
              exit 1
            fi
            dep_stripped="${dep_version#=}"
            if [[ "$dep_stripped" != "$WORKSPACE_VERSION" ]]; then
              echo "error: $manifest gregg-protocol dependency $dep_version != workspace $WORKSPACE_VERSION" >&2
              exit 1
            fi
          done
          echo "Version consistency OK: $VERSION"

      - name: Verify tag points at checked-out commit and tree is clean
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          HEAD_SHA="$(git rev-parse HEAD)"
          TAG_SHA="$(git rev-list -n 1 "$TAG" 2>/dev/null || echo "")"
          if [[ -z "$TAG_SHA" ]]; then
            echo "error: tag $TAG does not exist locally" >&2
            exit 1
          fi
          if [[ "$HEAD_SHA" != "$TAG_SHA" ]]; then
            echo "error: tag $TAG points at $TAG_SHA but HEAD is $HEAD_SHA" >&2
            echo "The workflow must run on the exact tagged commit." >&2
            exit 1
          fi
          echo "Tag $TAG correctly points at HEAD $HEAD_SHA"
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "error: working tree is not clean after checkout of $TAG" >&2
            git status --short
            exit 1
          fi
          echo "Clean tree verified"

      - name: Verify crates.io visibility (gregg, greggd)
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          # The release sequence publishes crates before the tag. A rerun must
          # remain safe. If the registry has not yet indexed the version, fail
          # clearly so the maintainer can rerun after indexing.
          for crate in gregg greggd; do
            echo "Checking crates.io for $crate $VERSION..."
            # crates.io API: https://crates.io/api/v1/crates/<name>/<version>
            HTTP_CODE="$(curl -s -o /tmp/crate.json -w "%{http_code}" \
              -H "User-Agent: gregg-release-ci (eggstack/gregg)" \
              "https://crates.io/api/v1/crates/${crate}/${VERSION}" || true)"
            if [[ "$HTTP_CODE" == "200" ]]; then
              echo "  $crate $VERSION is visible on crates.io"
            elif [[ "$HTTP_CODE" == "404" ]]; then
              echo "error: $crate $VERSION is not yet visible on crates.io (HTTP 404)" >&2
              echo "The release workflow requires the workspace version to be" >&2
              echo "published to crates.io before building GitHub binaries." >&2
              echo "Wait for indexing, then rerun this workflow." >&2
              cat /tmp/crate.json 2>/dev/null || true
              exit 1
            else
              echo "warning: crates.io check for $crate returned HTTP $HTTP_CODE; treating as hard failure" >&2
              cat /tmp/crate.json 2>/dev/null || true
              exit 1
            fi
          done

  build-linux-x86_64:
    name: Linux x86_64 (glibc 2.17)
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Zig and cargo-zigbuild
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet ziglang
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          zig version
          cargo install cargo-zigbuild --locked
          cargo zigbuild --version

      - name: Build gregg and greggd (x86_64, glibc 2.17)
        shell: bash
        run: |
          set -euo pipefail
          cargo zigbuild --release --locked -p gregg -p greggd --target x86_64-unknown-linux-gnu.2.17

      - name: Stage assets with public names
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/gregg dist/gregg-x86_64-unknown-linux-gnu
          cp target/x86_64-unknown-linux-gnu/release/greggd dist/greggd-x86_64-unknown-linux-gnu
          chmod +x dist/gregg-x86_64-unknown-linux-gnu dist/greggd-x86_64-unknown-linux-gnu
          ls -lh dist/

      - name: Smoke - version and help
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.preflight.outputs.version }}"
          ./dist/gregg-x86_64-unknown-linux-gnu version
          ./dist/gregg-x86_64-unknown-linux-gnu version | grep -q "gregg $VERSION"
          ./dist/gregg-x86_64-unknown-linux-gnu --help
          ./dist/greggd-x86_64-unknown-linux-gnu version
          ./dist/greggd-x86_64-unknown-linux-gnu version | grep -q "greggd $VERSION"
          ./dist/greggd-x86_64-unknown-linux-gnu --help

      - name: Daemon loopback smoke (/v2/healthz + /v2/status)
        shell: bash
        run: |
          set -euo pipefail
          # Use the shared verifier when available; fall back to a minimal inline smoke
          if [[ -x scripts/verify-installed-daemon.sh ]]; then
            bash scripts/verify-installed-daemon.sh dist/greggd-x86_64-unknown-linux-gnu
          else
            TMPDIR="$(mktemp -d)"
            CONFIG="$TMPDIR/greggd.toml"
            PORT=11399
            cat >"$CONFIG" <<EOF
          name = "release-smoke"
          host = "127.0.0.1"
          port = $PORT
          sample_interval_ms = 250
          stale_after_ms = 10000
          EOF
            ./dist/greggd-x86_64-unknown-linux-gnu --config "$CONFIG" run &
            PID=$!
            trap 'kill $PID 2>/dev/null; wait $PID 2>/dev/null; rm -rf "$TMPDIR"' EXIT
            # Poll until ready (max 15s)
            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:$PORT/v2/healthz" | grep -q '"state":"ready"'; then
                break
              fi
              sleep 0.5
            done
            curl -fsS "http://127.0.0.1:$PORT/v2/healthz" | grep -q '"schema_version":2'
            curl -fsS "http://127.0.0.1:$PORT/v2/status" | grep -q '"schema_version":2'
            kill $PID
            wait $PID
            rm -rf "$TMPDIR"
            trap - EXIT
          fi

      - name: Generate SHA-256 checksums (post-version, pre-modification)
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum gregg-x86_64-unknown-linux-gnu > gregg-x86_64-unknown-linux-gnu.sha256
          sha256sum greggd-x86_64-unknown-linux-gnu > greggd-x86_64-unknown-linux-gnu.sha256
          cat gregg-x86_64-unknown-linux-gnu.sha256
          cat greggd-x86_64-unknown-linux-gnu.sha256
          sha256sum -c gregg-x86_64-unknown-linux-gnu.sha256
          sha256sum -c greggd-x86_64-unknown-linux-gnu.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/*
          if-no-files-found: error

