                break
              fi
              sleep 0.5
            done
            curl -fsS "http://127.0.0.1:$PORT/v2/healthz" | grep -q '"schema_version":2'
            curl -fsS "http://127.0.0.1:$PORT/v2/status" | grep -q '"schema_version":2'
            kill $PID
            wait $PID
            rm -rf "$TMPDIR"
            trap - EXIT
          fi

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 gregg-aarch64-apple-darwin > gregg-aarch64-apple-darwin.sha256
          shasum -a 256 greggd-aarch64-apple-darwin > greggd-aarch64-apple-darwin.sha256
          cat gregg-aarch64-apple-darwin.sha256
          cat greggd-aarch64-apple-darwin.sha256
          shasum -a 256 -c gregg-aarch64-apple-darwin.sha256
          shasum -a 256 -c greggd-aarch64-apple-darwin.sha256

      - name: Upload artifact
