name: phase34-full-contract-qualification

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact implementation SHA to qualify"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

permissions:
  contents: read

jobs:
  qualify:
    name: Nonpublishing executable-closure qualification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify immutable checkout
        run: |
          set -euo pipefail
          [[ "${{ inputs.candidate_sha }}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${{ inputs.candidate_sha }}"
      - name: Record hosted command metadata
        run: |
          set -euo pipefail
          mkdir -p evidence/metadata
          echo "${{ inputs.candidate_sha }}" > evidence/metadata/implementation-sha.txt
          echo "${{ github.repository }}" > evidence/metadata/repository.txt
          echo "${{ github.workflow }}" > evidence/metadata/workflow.txt
          echo "${{ github.run_id }}" > evidence/metadata/run-id.txt
          echo "${{ github.run_attempt }}" > evidence/metadata/run-attempt.txt
          echo "${{ runner.os }}" > evidence/metadata/runner-os.txt
          echo "${{ runner.arch }}" > evidence/metadata/runner-arch.txt
          rustc --version --verbose > evidence/metadata/rustc-version.txt
          cargo --version > evidence/metadata/cargo-version.txt
          python3 --version > evidence/metadata/python-version.txt
          date -u +%Y-%m-%dT%H:%M:%SZ > evidence/metadata/started-at.txt
      - name: Local CI gates
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-targets --all-features
          cargo doc --workspace --no-deps
          python3 -m unittest discover -s scripts/tests -p 'test*.py'
          python3 scripts/validate-release-workflow.py
          for script in scripts/*.sh packaging/*.sh; do bash -n "$script"; done
      - name: Real sustained smoke
        run: |
          set -euo pipefail
          python3 scripts/run-mixed-fleet-sustained.py --duration-seconds 3 \
            --sample-interval-seconds 0.25 --evidence-dir evidence/sustained-smoke
      - name: Complete nonpublishing orchestration qualification
        run: |
          set -euo pipefail
          python3 scripts/run-release-orchestration-qualification.py \
            --candidate-sha "${{ inputs.candidate_sha }}" --release-version 1.0.1 \
            --requirements plans/evidence/release-requirements.json \
            --dispatch-contract plans/evidence/release-dispatch-contract.json \
            --qualification-contract plans/evidence/phase34-qualification-contract.json \
            --evidence-dir evidence/orchestration
      - name: Validate qualification output
        run: |
          set -euo pipefail
          date -u +%Y-%m-%dT%H:%M:%SZ > evidence/metadata/completed-at.txt
          python3 scripts/validate-qualification-output.py \
            --summary evidence/orchestration/qualification-summary.json \
            --contract plans/evidence/phase34-qualification-contract.json \
            --requirements plans/evidence/release-requirements.json \
            --dispatch-contract plans/evidence/release-dispatch-contract.json \
            --hosted-metadata-root evidence/metadata
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase34-full-contract-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: error
          include-hidden-files: true
