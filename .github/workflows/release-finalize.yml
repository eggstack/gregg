name: release-finalize

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Frozen candidate SHA (lowercase 40-char)"
        required: true
        type: string
      release_version:
        description: "Release version (fixed to 1.0.1)"
        required: true
        type: string
        default: "1.0.1"
      selection_base64:
        description: "Base64-encoded immutable run selection JSON"
        required: true
        type: string
      disposition_decision_base64:
        description: "Base64-encoded operator decision for published 1.0.0 crates"
        required: false
        type: string
      mode:
        description: "pre-tag review or final postpublication aggregation"
        required: true
        type: choice
        default: pre-tag
        options:
          - pre-tag
          - final
      tag_name:
        description: "Annotated tag name (final mode only, e.g. v1.0.1)"
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

permissions:
  contents: read
  actions: read

jobs:
  finalize:
    name: Final cross-run aggregation
    runs-on: ubuntu-latest
    environment: gregg-release
    steps:
      - name: Checkout immutable tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate inputs
        run: |
          set -euo pipefail
          [[ "${{ inputs.candidate_sha }}" =~ ^[0-9a-f]{40}$ ]] || { echo "FATAL: candidate_sha must be a lowercase 40-character SHA" >&2; exit 1; }
          [[ "${{ inputs.release_version }}" == "1.0.1" ]] || { echo "FATAL: release_version must be 1.0.1" >&2; exit 1; }
          actual_sha="$(git rev-parse HEAD)"
          test "${actual_sha}" = "${{ inputs.candidate_sha }}" || { echo "FATAL: checked-out SHA ${actual_sha} does not match candidate ${{ inputs.candidate_sha }}" >&2; exit 1; }
          if [[ "${{ inputs.mode }}" == "final" ]]; then
            [[ "${{ inputs.tag_name }}" == "v1.0.1" ]] || { echo "FATAL: final mode requires tag_name v1.0.1" >&2; exit 1; }
          fi
      - name: Retrieve and validate cross-run evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p evidence final
          selection_info="$(python3 scripts/decode-release-selection.py \
            --base64 '${{ inputs.selection_base64 }}' \
            --candidate-sha '${{ inputs.candidate_sha }}' \
            --release-version '${{ inputs.release_version }}' \
            --output evidence/release-run-selection.json \
            --workflow-run-id '${{ github.run_id }}' \
            --workflow-run-attempt '${{ github.run_attempt }}' \
            --actor '${{ github.actor }}' \
            --identity-output evidence/selection-identity.json)"
          selection_sha="$(jq -r .sha256 <<<"${selection_info}")"
          selection_size="$(jq -r .size_bytes <<<"${selection_info}")"
          printf '%s\n' "selection_sha=${selection_sha}" "selection_size=${selection_size}" > evidence/selection-input.txt
          python3 scripts/github-artifact-retrieval.py \
            --selection evidence/release-run-selection.json \
            --selection-source workflow-dispatch-base64 \
            --selection-identity evidence/selection-identity.json \
            --selection-workflow-run-id '${{ github.run_id }}' \
            --selection-workflow-run-attempt '${{ github.run_attempt }}' \
            --repo "${{ github.repository }}" \
            --output evidence/retrieved-manifest.json
      - name: Merge package provenance
        run: |
          set -euo pipefail
          if [[ -f evidence/provenance-index.json ]]; then
            protocol_provenance="$(jq -r '.packages["gregg-protocol"].provenance_path // empty' evidence/provenance-index.json)"
            daemon_provenance="$(jq -r '.packages["greggd"].provenance_path // empty' evidence/provenance-index.json)"
            client_provenance="$(jq -r '.packages["gregg"].provenance_path // empty' evidence/provenance-index.json)"
            if [[ -n "$protocol_provenance" && -n "$daemon_provenance" && -n "$client_provenance" ]]; then
              python3 scripts/merge-package-provenance.py \
                --protocol "$protocol_provenance" --daemon "$daemon_provenance" --client "$client_provenance" \
                --expected-sha "${{ inputs.candidate_sha }}" --release-version "${{ inputs.release_version }}" \
                --output evidence/v1.0.1-package-provenance.json
            fi
          fi
      - name: Decode disposition decision (final mode)
        if: ${{ inputs.mode == 'final' }}
        run: |
          set -euo pipefail
          test -n '${{ inputs.disposition_decision_base64 }}'
          python3 scripts/decode-release-disposition.py \
            --base64 '${{ inputs.disposition_decision_base64 }}' \
            --candidate-sha '${{ inputs.candidate_sha }}' \
            --output evidence/disposition-decision.json \
            --identity-output evidence/disposition-decision-identity.json \
            --workflow-run-id '${{ github.run_id }}' \
            --workflow-run-attempt '${{ github.run_attempt }}' \
            --actor '${{ github.actor }}'
      - name: Prepare final release inputs (final mode)
        if: ${{ inputs.mode == 'final' }}
        run: |
          set -euo pipefail
          # E2: Locate the selected postpublish artifact from the retrieved manifest.
          postpublish_root="$(python3 -c '
          import json, sys
          manifest = json.load(open("evidence/retrieved-manifest.json"))
          for stage in manifest.get("stages", []):
              if stage.get("stage") == "postpublish-verify":
                  extraction_root = stage.get("artifact", {}).get("extraction_root")
                  if extraction_root:
                      print(extraction_root)
                      sys.exit(0)
          sys.exit(1)
          ')"
          test -n "$postpublish_root"
          # Read candidate declarations from the retrieved postpublish artifact.
          candidate_path="evidence/$postpublish_root/postpublish-verify/candidate.json"
          if [ ! -f "$candidate_path" ]; then
            candidate_path="evidence/$postpublish_root/candidate.json"
          fi
          test -f "$candidate_path"
          # Build artifact list from candidate declarations.
          python3 -c "
          import json, sys
          candidate = json.load(open('$candidate_path'))
          artifacts = []
          for item in candidate.get('artifacts', []):
              role = item.get('role')
              if role in ('registry-summary', 'version-1.0.0-disposition'):
                  artifacts.append({
                      'name': item.get('name', item.get('path')),
                      'role': role,
                      'stage': candidate.get('stage', 'postpublish-verify'),
                      'workflow_run_id': str(candidate.get('workflow_run_id', '')),
                      'workflow_run_attempt': str(candidate.get('workflow_run_attempt', '1')),
                      'artifact_id': item.get('artifact_id', stage_artifact_id),
                      'artifact_name': item.get('artifact_name', stage_artifact_name),
                      'zip_sha256': item.get('zip_sha256', ''),
                      'zip_size_bytes': item.get('zip_size_bytes', 0),
                      'sha256': item['sha256'],
                      'size_bytes': item['size_bytes'],
                  })
          json.dump(artifacts, open('evidence/postpublish-evidence-artifacts.json', 'w'), indent=2)
          " 2>/dev/null || python3 -c "
          import json, sys
          manifest = json.load(open('evidence/retrieved-manifest.json'))
          for stage in manifest.get('stages', []):
              if stage.get('stage') == 'postpublish-verify':
                  art = stage.get('artifact', {})
                  artifacts = [
                      {'name': 'registry-summary.json', 'role': 'registry-summary',
                       'stage': 'postpublish-verify',
                       'workflow_run_id': str(stage.get('workflow_run_id', '')),
                       'workflow_run_attempt': str(stage.get('workflow_run_attempt', '1')),
                       'artifact_id': art.get('id', 0),
                       'artifact_name': art.get('name', ''),
                       'zip_sha256': art.get('zip_sha256', ''),
                       'zip_size_bytes': art.get('zip_size_bytes', 0),
                       'sha256': '', 'size_bytes': 0},
                      {'name': '1.0.0-disposition.json', 'role': 'version-1.0.0-disposition',
                       'stage': 'postpublish-verify',
                       'workflow_run_id': str(stage.get('workflow_run_id', '')),
                       'workflow_run_attempt': str(stage.get('workflow_run_attempt', '1')),
                       'artifact_id': art.get('id', 0),
                       'artifact_name': art.get('name', ''),
                       'zip_sha256': art.get('zip_sha256', ''),
                       'zip_size_bytes': art.get('zip_size_bytes', 0),
                       'sha256': '', 'size_bytes': 0},
                  ]
                  json.dump(artifacts, open('evidence/postpublish-evidence-artifacts.json', 'w'), indent=2)
                  break
          "
          # E2: Use the shared final-input preparation helper.
          python3 scripts/prepare-final-release-inputs.py \
            --artifact-list evidence/postpublish-evidence-artifacts.json \
            --root "evidence/$postpublish_root" \
            --output evidence/role-index.json \
            --materialize-dir evidence/materialized \
            --expected-candidate-sha '${{ inputs.candidate_sha }}' \
            --expected-version '${{ inputs.release_version }}' \
            --required-role registry-summary \
            --required-role version-1.0.0-disposition
      - name: Generate manifest
        run: |
          set -euo pipefail
          tooling_sha="$(git rev-parse HEAD)"
          aggregate_args=(
            --evidence-dir evidence
            --expected-sha "${{ inputs.candidate_sha }}"
            --release-version "${{ inputs.release_version }}"
            --output evidence/v1.0.1-release-manifest.json
            --retrieved-manifest evidence/retrieved-manifest.json
            --selection evidence/release-run-selection.json
            --mode "${{ inputs.mode }}"
            --tooling-sha "${tooling_sha}"
            --selection-source workflow-dispatch-base64
            --selection-workflow-run-id "${{ github.run_id }}"
            --selection-workflow-run-attempt "${{ github.run_attempt }}"
            --requirements plans/evidence/release-requirements.json
          )
          if [[ "${{ inputs.mode }}" == "final" ]]; then
            tag_object_sha="$(git rev-parse 'v1.0.1^{tag}' 2>/dev/null || echo '')"
            peeled_commit_sha="$(git rev-parse 'v1.0.1^{commit}' 2>/dev/null || echo '')"
            tagger_name="$(git for-each-ref --format='%(taggername)' refs/tags/v1.0.1)"
            tagger_email="$(git for-each-ref --format='%(taggeremail)' refs/tags/v1.0.1)"
            tagger_timestamp="$(git for-each-ref --format='%(taggerdate:iso8601-strict)' refs/tags/v1.0.1)"
            tagger_timestamp_normalized="$(python3 -c '
          import datetime as dt, sys
          raw = sys.argv[1].strip()
          if not raw:
              sys.exit(1)
          try:
              parsed = dt.datetime.fromisoformat(raw)
          except ValueError:
              parsed = dt.datetime.strptime(raw, "%Y-%m-%d %H:%M:%S%z")
          if parsed.utcoffset() is None:
              parsed = parsed.replace(tzinfo=dt.timezone.utc)
          print(parsed.astimezone(dt.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"))
          ' "$tagger_timestamp")"
            tag_object_content_sha="$(git cat-file tag v1.0.1 | sha256sum | awk '{print $1}')"
            aggregate_args+=(
              --tag-name "v1.0.1" --tag-object-sha "$tag_object_sha" --peeled-commit-sha "$peeled_commit_sha"
              --tagger-name "$tagger_name" --tagger-email "$tagger_email"
              --tagger-timestamp "$tagger_timestamp_normalized" --tag-object-content-sha256 "$tag_object_content_sha"
              --package-provenance evidence/v1.0.1-package-provenance.json
              --role-index evidence/role-index.json
              --final
            )
          fi
          scripts/aggregate-release-evidence.sh "${aggregate_args[@]}"
      - name: Record manifest checksum
        run: |
          set -euo pipefail
          sha256sum evidence/v1.0.1-release-manifest.json | tee evidence/manifest.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-manifest-${{ inputs.candidate_sha }}
          path: |
            evidence/release-run-selection.json
            evidence/selection-identity.json
            evidence/v1.0.1-release-manifest.json
            evidence/retrieved-manifest.json
            evidence/provenance-index.json
            evidence/v1.0.1-package-provenance.json
            evidence/manifest.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.mode == 'final' }}
        with:
          name: release-final-inputs-${{ inputs.candidate_sha }}
          path: |
            evidence/role-index.json
            evidence/materialized/registry-summary.json
            evidence/materialized/version-1.0.0-disposition.json
            evidence/disposition-decision.json
            evidence/disposition-decision-identity.json
          if-no-files-found: error
