# VENDORED COPY OF `annotate-snippets` 0.12.9 — SEE ../VENDORED-PATCH.md.
#
# This file is upstream's crates.io-normalized manifest with exactly these
# changes, and no source file has been touched:
#
#   1. `unicode-width` relaxed from "0.2.2" to "0.2" (see below).
#   2. The `[[example]]` targets and `[dev-dependencies]` removed: this copy
#      is only ever built as a library dependency of the Slint compiler, and
#      cargo refuses to load a manifest whose declared target file is
#      missing.
#   3. The `[profile.*]` tables removed: cargo ignores (and warns about)
#      profiles declared in a non-root package.
#   4. An empty `[workspace]` table added, so this copy is its own workspace
#      root and is not pulled into the `apps/gregg-gui` workspace as a member.
#
# WHY THE RELAXATION IS SAFE AND NECESSARY:
#
# `ratatui` 0.29 — pulled in transitively by the `gregg` core library this
# app links against — pins `unicode-width =0.2.0` exactly. `annotate-snippets`
# 0.12.9 asks for `unicode-width ^0.2.2`. Cargo keeps at most one version of a
# crate per semver-compatibility range, and 0.2.0 and 0.2.2 are in the same
# range, so the two requirements cannot be unified and the whole graph fails
# to resolve. Relaxing the bound to "0.2" makes every requirement in the
# graph agree on 0.2.0.
#
# The only `unicode-width` API this crate uses is
# `UnicodeWidthChar::width(ch) -> Option<usize>` (`src/renderer/render.rs`),
# which exists — with exactly this signature — in unicode-width 0.2.0. The
# bound was raised to 0.2.2 upstream for freshness, not for a new API.

[workspace]

[package]
edition = "2021"
rust-version = "1.66.0"
name = "annotate-snippets"
version = "0.12.9"
build = false
include = [
    "src/**/*",
    "Cargo.toml",
    "LICENSE*",
    "README.md",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Format diagnostic reports, including highlighting snippets of text"
readme = "README.md"
keywords = [
    "code",
    "analysis",
    "ascii",
    "errors",
    "debug",
]
categories = []
license = "MIT OR Apache-2.0"
repository = "https://github.com/rust-lang/annotate-snippets-rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--generate-link-to-definition"]

[package.metadata.release]
tag-name = "{{version}}"

[[package.metadata.release.pre-release-replacements]]
file = "CHANGELOG.md"
search = "Unreleased"
replace = "{{version}}"
min = 1

[[package.metadata.release.pre-release-replacements]]
file = "CHANGELOG.md"
search = '\.\.\.HEAD'
replace = "...{{tag_name}}"
exactly = 1

[[package.metadata.release.pre-release-replacements]]
file = "CHANGELOG.md"
search = "ReleaseDate"
replace = "{{date}}"
min = 1

[[package.metadata.release.pre-release-replacements]]
file = "CHANGELOG.md"
search = "<!-- next-header -->"
replace = """
<!-- next-header -->
## [Unreleased] - ReleaseDate
"""
exactly = 1

[[package.metadata.release.pre-release-replacements]]
file = "CHANGELOG.md"
search = "<!-- next-url -->"
replace = """
<!-- next-url -->
[Unreleased]: https://github.com/rust-lang/annotate-snippets-rs/compare/{{tag_name}}...HEAD"""
exactly = 1

[badges.maintenance]
status = "actively-developed"

[features]
default = []
simd = ["dep:memchr"]
testing-colors = []

[lib]
name = "annotate_snippets"
path = "src/lib.rs"


[dependencies.anstyle]
version = "1.0.4"

[dependencies.memchr]
version = "2.7.4"
optional = true

[dependencies.unicode-width]
# VENDORED PATCH: upstream requires "0.2.2"; relaxed to "0.2" so this copy
# can share unicode-width 0.2.0 with ratatui 0.29. See the header comment.
version = "0.2"


[lints.clippy]
bool_assert_comparison = "allow"
branches_sharing_code = "allow"
checked_conversions = "warn"
collapsible_else_if = "allow"
create_dir = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
doc_markdown = "warn"
empty_enum = "warn"
enum_glob_use = "warn"
expl_impl_clone_on_copy = "warn"
explicit_deref_methods = "warn"
explicit_into_iter_loop = "warn"
fallible_impl_from = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
float_cmp_const = "warn"
fn_params_excessive_bools = "warn"
from_iter_instead_of_collect = "warn"
if_same_then_else = "allow"
implicit_clone = "warn"
imprecise_flops = "warn"
inconsistent_struct_constructor = "warn"
inefficient_to_string = "warn"
infinite_loop = "warn"
invalid_upcast_comparisons = "warn"
large_digit_groups = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
let_and_return = "allow"
linkedlist = "warn"
lossy_float_literal = "warn"
macro_use_imports = "warn"
mem_forget = "warn"
mutex_integer = "warn"
needless_continue = "allow"
needless_for_each = "warn"
negative_feature_names = "warn"
path_buf_push_overwrite = "warn"
ptr_as_ptr = "warn"
rc_mutex = "warn"
redundant_feature_names = "warn"
ref_option_ref = "warn"
rest_pat_in_fully_bound_structs = "warn"
result_large_err = "allow"
same_functions_in_if_condition = "warn"
self_named_module_files = "warn"
semicolon_if_nothing_returned = "warn"
str_to_string = "warn"
string_add = "warn"
string_add_assign = "warn"
string_lit_as_bytes = "warn"
todo = "warn"
trait_duplication_in_bounds = "warn"
uninlined_format_args = "warn"
verbose_file_reads = "warn"
wildcard_imports = "warn"
zero_sized_map_values = "warn"

[lints.rust]
unnameable_types = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[lints.rust.rust_2018_idioms]
level = "warn"
priority = -1


