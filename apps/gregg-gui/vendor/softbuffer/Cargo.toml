# VENDORED COPY OF `softbuffer` 0.4.8 — SEE ../VENDORED-PATCH.md.
#
# This file is upstream's crates.io-normalized manifest with exactly these
# changes, and exactly one source file has been touched:
#
#   1. `src/backends/cg.rs` — the macOS CoreGraphics backend now declares the
#      framebuffer's alpha channel to CoreGraphics instead of dropping it.
#      See the header comment in that file and ../VENDORED-PATCH.md.
#   2. The `[[bench]]` target and every `[dev-dependencies]` table removed:
#      this copy is only ever built as a library dependency of Slint's winit
#      backend, and cargo refuses to load a manifest whose declared target
#      file is missing.
#   3. `include` replaces `exclude`, so the vendored copy packages only the
#      files this crate actually builds from.
#   4. An empty `[workspace]` table added, so this copy is its own workspace
#      root and is not pulled into the `apps/gregg-gui` workspace as a member.
#
# WHY THE SOURCE PATCH IS SAFE AND NECESSARY:
#
# Slint's software renderer presents its frames through `softbuffer`, and
# `softbuffer`'s macOS backend hands CoreGraphics a `CGImage` whose pixel
# format declares NO alpha channel (`CGImageAlphaInfo::NoneSkipFirst`). Every
# transparent pixel of a Slint window is therefore presented opaque, so a
# frameless Slint window on macOS paints its unpainted margin as solid black
# instead of letting the desktop through. The one-word change to
# `CGImageAlphaInfo::PremultipliedFirst` restores the alpha channel; the
# pixel layout of the buffer is unchanged and stays premultiplied, which is
# exactly what CoreGraphics expects for that alpha information.

