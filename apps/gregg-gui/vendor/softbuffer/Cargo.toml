[package]
edition = "2021"
rust-version = "1.71.0"
name = "softbuffer"
version = "0.4.8"
build = false
include = [
    "src/**/*",
    "Cargo.toml",
    "LICENSE*",
    "README.md",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Cross-platform software buffer"
documentation = "https://docs.rs/softbuffer"
readme = "README.md"
keywords = [
    "framebuffer",
    "windowing",
]
categories = [
    "game-development",
    "graphics",
    "gui",
    "multimedia",
    "rendering",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rust-windowing/softbuffer"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]
