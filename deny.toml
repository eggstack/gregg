[advisories]
unmaintained = "workspace"
yanked = "warn"
# The only remaining advisory is in reqwest's disabled optional HTTP/3
# dependency. Its fixed release requires Rust 1.85, while this workspace's
# declared MSRV is Rust 1.75; the feature is not enabled by any workspace crate.
ignore = ["RUSTSEC-2026-0185"]

[licenses]
unused-allowed-license = "warn"
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
