[advisories]
unmaintained = "workspace"
yanked = "warn"
ignore = [
    # RUSTSEC-2026-0543: chrono 0.4.45 is unmaintained. It is a direct greggd
    # dependency for civil-time schedule math (`crates/greggd/src/scheduler/`);
    # no patched release exists and the advisory affects every version, so the
    # only fix is adopting a maintained successor (jiff/time). Review trigger:
    # that successor adoption, a new chrono vulnerability advisory (this ignore
    # must not be extended for one), or the next major release planning.
    "RUSTSEC-2026-0543",
    # RUSTSEC-2026-0555: chrono-tz 0.10.4 is unmaintained. It is a greggd
    # dev-dependency for time-zone conversion in scheduler tests; no patched
    # release exists and the advisory affects every version. Review trigger: a
    # maintained successor adoption, a new chrono-tz vulnerability advisory
    # (this ignore must not be extended for one), or the next major release
    # planning.
    "RUSTSEC-2026-0555",
]

[licenses]
unused-allowed-license = "warn"
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
