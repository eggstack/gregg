# Gregg client configuration
# This file is loaded from the platform-specific config directory or via --config.
# Linux:   ~/.config/gregg/gregg.toml
# macOS:   ~/Library/Application Support/gregg/gregg.toml
# Windows: %APPDATA%\gregg\gregg.toml

config_version = 1

# Global polling interval in seconds (1..=3600).
refresh_seconds = 5

# HTTP request timeout in milliseconds (100+).
request_timeout_ms = 1500

# Maximum concurrent polling requests (1..=64).
max_concurrent_requests = 16

# Retained for configuration compatibility (1..=65535). The `gregg add`
# CLI requires an explicit port and does not use this field for new systems.
default_port = 11310

# Monitored systems.
# Each entry requires: id (UUID v4), host, port.
# An optional name provides a display label (`name@host:port` in the
# offline header).

[[systems]]
id = "a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d"
host = "192.168.182.8"
port = 11310
name = "Deadpool"

[[systems]]
id = "f6e5d4c3-b2a1-4f7e-8d9c-0b1a2f3e4d5c"
host = "macmini.local"
port = 11310

# Optional EggPool statistics source. Omit this table to disable the pane.
# The CLI accepts `gregg eggpool add HOST`, defaulting to HTTP port 11300.
# Public EggPool instances omit api_key_env. Protected instances name an
# environment variable here; set its value in the environment before running
# the TUI. The key value is never stored in this file.
# [eggpool]
# id = "01234567-89ab-4cde-8123-456789abcdef"
# host = "eggpool.local"
# port = 11300
# scheme = "http"
# name = "Main EggPool"
# api_key_env = "EGGPOOL_GREGG_API_KEY"

# Optional cron observability settings. Omit this table to use the defaults.
#
# These are two independent numbers with two independent hard maxima, because
# they answer different questions:
#
#   display_history  how many terminal records the cron pane shows for the
#                    selected job. A viewport, defaulting to the remote
#                    greggd's own retention so the common case is exactly
#                    what the remote still holds. Range 1..=20.
#   cache_history    how many terminal records the client daemon keeps in
#                    memory per job. Retention, and deliberately deeper than
#                    the display window because the daemon is always running
#                    and observes rings the remote has already dropped.
#                    Range 1..=50, and must be at least display_history.
#
# A global record ceiling across every system and job applies regardless of
# these values, so raising cache_history cannot turn a bounded cache into an
# unbounded one. Nothing is written to disk: a client-daemon restart reseeds
# from whatever the remote still holds.
# [cron]
# display_history = 5
# cache_history = 25
