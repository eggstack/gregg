[package]
name = "gregg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Compact keyboard-first terminal monitor that polls greggd endpoints and renders each system in a compact five-row base block."
keywords = ["tui", "monitoring", "metrics", "ratatui", "cli"]
categories = ["command-line-utilities", "visualization"]
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE", "config.example.toml", "tests/**"]

[features]
default = []
test-helper = []

[lib]
name = "gregg"
path = "src/lib.rs"

[[bin]]
name = "gregg"
path = "src/main.rs"

[[bin]]
name = "lock_helper"
path = "src/bin/lock_helper.rs"
required-features = ["test-helper"]

[dependencies]
gregg-protocol = { version = "1.0.13", path = "../gregg-protocol" }
gregg-update = { version = "1.0.13", path = "../gregg-update" }
clap = { version = ">=4.0, <4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
thiserror = { version = "1.0", default-features = false }
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "signal", "net"] }
eggfetch-core = { version = "0.1.7", default-features = false, features = ["standard-http1", "tls-rustls"] }
url = "2"
tokio-util = "0.7"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.28", default-features = false, features = ["event-stream"] }
futures-util = { version = "0.3", default-features = false }
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_System_IO"] }

[dev-dependencies]
gregg-protocol = { version = "1.0.13", path = "../gregg-protocol", features = ["test_support"] }
tokio = { version = "1", features = ["test-util"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
