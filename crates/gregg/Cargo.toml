[package]
name = "gregg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Compact keyboard-first terminal monitor that polls greggd endpoints and renders each system in four rows."
keywords = ["tui", "monitoring", "metrics", "ratatui", "cli"]
categories = ["command-line-utilities", "visualization"]
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE", "config.example.toml"]

[[bin]]
name = "gregg"
path = "src/main.rs"

[dependencies]
gregg-protocol = { version = "1.0.1", path = "../gregg-protocol" }
clap = { version = ">=4.0, <4.5", features = ["derive"] }
# Compatibility-only bounds keep fresh transitive resolution within Rust 1.75.
indexmap = ">=2.0, <2.12"
instability = ">=0.3, <0.3.11"
unicode-segmentation = ">=1.10, <1.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = ">=1.11, <1.21", features = ["v4"] }
thiserror = { version = "1.0", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "net"] }
reqwest = { version = ">=0.12.28, <0.12.29", default-features = false, features = ["json", "rustls-tls", "stream"] }
url = ">=2.5.4, <2.5.5"
idna = ">=1.0.3, <1.1"
idna_adapter = ">=1.1, <1.2"
hyper-rustls = { version = ">=0.27, <0.27.8", default-features = false }
quinn-proto = { version = ">=0.11.14, <0.11.15", default-features = false }
rustc-hash = ">=2.0, <2.1"
thiserror-compat = { package = "thiserror", version = ">=2.0.3, <2.0.13" }
zeroize = ">=1.7, <1.9"
tokio-util = "0.7"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.28", default-features = false, features = ["event-stream"] }
futures-util = { version = "0.3", default-features = false }
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
gregg-protocol = { version = "1.0.0", path = "../gregg-protocol", features = ["test_support"] }

[lints]
workspace = true
