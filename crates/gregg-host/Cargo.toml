[package]
name = "gregg-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Native host telemetry acquisition for Gregg: Linux, macOS, Windows (and BSD) CPU, memory, drives, disk-I/O, and network with explicit warmup/reset semantics. Runtime-neutral and protocol-neutral."
keywords = ["metrics", "telemetry", "system", "monitoring"]
categories = ["os", "system"]
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE"]

[lib]
name = "gregg_host"
path = "src/lib.rs"

[dependencies]
thiserror = { version = "1.0", default-features = false }
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
