[workspace]
resolver = "2"
members = [
    "crates/gregg-protocol",
    "crates/gregg-update",
    "crates/gregg-host",
    "crates/greggd",
    "crates/gregg",
]
# Plan 188: the optional Slint desktop frontend is deliberately NOT a member of
# this workspace. Slint 1.18 requires Rust >= 1.92 and this workspace's MSRV is
# 1.89, so a member here would break `cargo test --workspace --all-features`
# under the MSRV CI job even with no core code touched. `apps/gregg-gui` owns
# its own workspace and lockfile; this entry makes the ownership unambiguous so
# a future `members = ["apps/*"]` glob cannot silently pull it back in.
exclude = ["apps/gregg-gui"]

[workspace.package]
version = "1.0.15"
edition = "2021"
rust-version = "1.89"
license = "MIT"
authors = ["David Bowman <dbowman91@proton.me>"]
repository = "https://github.com/eggstack/gregg"
homepage = "https://github.com/eggstack/gregg"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
result_large_err = "allow"

[workspace.metadata.docs.rs]
all-features = true

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
# Unwinding is deliberately retained. `catch_unwind` in the gregg-host drive
# refresh worker, `JoinError` supervision in greggd's `run_with_shutdown`, and
# the panicked-task-to-`Cancelled` result in gregg's scheduler are all
# production behaviour, and `panic = "abort"` silently made every one of them
# unreachable in the shipped binaries.
